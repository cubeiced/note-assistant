/* ---- 任务2：工作日志板块 · AI 今日复盘 ---- */
function wlTodayItems(){
  const folder=state.folders.find(f=>f.isWorklog);
  const start=new Date();start.setHours(0,0,0,0);
  return state.items.filter(i=>i.folderId===folder.id&&i.timestamp>=start.getTime());
}
function wlCollectContext(){
  const items=wlTodayItems();
  const draft=(document.querySelector('#wlText')?.value||'').trim();
  if(!items.length&&!draft)return null;
  const lines=[];
  items.forEach(i=>{
    const t=new Date(i.timestamp).toTimeString().slice(0,5);
    if(i.todos)lines.push('- ['+i.tag+' '+t+'] 待办：'+i.todos.map(x=>(x.done?'[已完成] ':'[未完成] ')+x.text).join('；'));
    else if(i.rawText)lines.push('- ['+(i.tag||'记录')+' '+t+'] '+i.rawText);
    else if(i.tag)lines.push('- ['+i.tag+' '+t+']（图片记录）');
  });
  if(draft)lines.push('【刚输入尚未保存的内容】\n'+draft);
  return lines.join('\n');
}
function aiReviewText(r){
  const L=['【AI 今日复盘】'+r.summary,''];
  if(r.done.length){L.push('完成事项：');r.done.forEach(x=>L.push('- '+x.item+(x.highlight?'（'+x.highlight+'）':'')));L.push('');}
  if(r.outputs.length){L.push('关键产出与发现：');r.outputs.forEach(x=>L.push('- '+x.area+'：'+x.finding));L.push('');}
  if(r.skills.length){L.push('能力沉淀：');r.skills.forEach(x=>L.push('- '+x.name+'：'+x.note));L.push('');}
  if(r.improve.length){L.push('待提升：');r.improve.forEach(x=>L.push('- '+x.gap+'：'+x.suggestion));L.push('');}
  if(r.tomorrow.length){L.push('明日建议：');r.tomorrow.forEach((x,i)=>L.push((i+1)+'. '+x));}
  return L.join('\n');
}
async function wlRunReview(slot,btn){
  const ctx=wlCollectContext();
  if(!ctx)return toast('今天还没有记录，先速记几条，或在上面的输入框里写点内容');
  btn.disabled=true;btn.textContent='◌ AI 复盘中…';
  slot.innerHTML='<div class="ai-card"><p class="ja-muted" role="status">AI 正在根据今天的记录生成复盘…</p></div>';
  try{
    const r=await callAI('workReview',ctx);
    slot.innerHTML='';
    const card=document.createElement('div');card.className='ai-card';
    const cnt=n=>'× '+n;
    card.innerHTML='<div class="ai-card-head"><b>🪞 AI 今日复盘</b><span class="ai-head-meta">'+new Date().toLocaleDateString('zh-CN')+' · '+wlTodayItems().length+' 条速记</span><button type="button" class="ai-edit-btn">✏️ 编辑</button></div>'
      +(r.summary?'<div class="ai-emph"><small>今日总览</small><span class="ai-emph-text" data-path="summary">'+escapeHtml(r.summary)+'</span></div>':'')
      +aiSec('完成事项',r.done.length?cnt(r.done.length):null)+r.done.map((x,i)=>aiRowH(x,'done.'+i,{t:'item',d:'highlight',badge:'已交付|high,进行中|mid,待开始|low'})).join('')
      +aiSec('关键产出与发现',r.outputs.length?cnt(r.outputs.length):null)+r.outputs.map((x,i)=>aiRowH(x,'outputs.'+i,{t:'area',d:'finding',badge:'发现|mid,产出|high,方法论|low'})).join('')
      +aiSec('能力沉淀',r.skills.length?cnt(r.skills.length):null)+r.skills.map((x,i)=>aiRowH(x,'skills.'+i,{t:'name',d:'note',badge:'能力|high,方法论|mid,发现|low'})).join('')
      +aiSec('待提升',r.improve.length?cnt(r.improve.length):null)+r.improve.map((x,i)=>aiRowH(x,'improve.'+i,{t:'gap',d:'suggestion',badge:'优先补|high,有余力再改|mid,已改善|low'})).join('')
      +aiSec('明日建议',r.tomorrow.length?cnt(r.tomorrow.length):null)+(r.tomorrow.length?'<div>'+r.tomorrow.map((x,i)=>'<label class="ai-todo"><input type="checkbox"><span data-path="tomorrow.'+i+'">'+escapeHtml(x)+'</span></label>').join('')+'</div>':'');
    const acts=document.createElement('div');acts.className='ai-card-actions';
    const save=document.createElement('button');save.className='v4-button';save.type='button';save.textContent='保存为今日复盘';
    save.onclick=()=>{const folder=state.folders.find(f=>f.isWorklog);addWorklogItem(folder.id,'日报',aiReviewText(r),null,[],null,{aiType:'workReview',aiData:r});slot.innerHTML='';toast('复盘已保存到工作日志');render();};
    const re=document.createElement('button');re.className='ghost-btn';re.type='button';re.textContent='重新生成';re.onclick=()=>wlRunReview(slot,re);
    acts.append(save,re);card.append(acts);
    aiEdBind(card,r,null);slot.append(card);
  }catch(e){slot.innerHTML='<div class="ai-card"><p class="ai-err">'+escapeHtml(aiErrorText(e))+'</p></div>';}
  finally{btn.disabled=false;btn.textContent='✦ AI 今日复盘';}
}
const wlAiBase=renderWorklogView;

/* ---- 任务3：课堂笔记板块 · AI 知识整理（知识卡片 / 思维导图 / 复习题） ---- */
function aiStudyText(r){
  const L=['【AI 知识整理】'+r.subject,''];
  if(r.concepts.length){L.push('核心概念：');r.concepts.forEach(x=>L.push('- '+x.term+'：'+x.explain));L.push('');}
  if(r.cards.length){L.push('知识卡片：');r.cards.forEach((c,i)=>L.push((i+1)+'. '+c.title+'\n   '+c.content));L.push('');}
  const flat=(n,d)=>{L.push('  '.repeat(d)+'- '+n.name);(n.children||[]).forEach(c=>flat(c,d+1));};
  if(r.tree.name){L.push('知识结构：');flat(r.tree,0);L.push('');}
  if(r.highlights.length){L.push('重点：');r.highlights.forEach(x=>L.push('* '+x));L.push('');}
  if(r.questions.length){L.push('复习问题：');r.questions.forEach((x,i)=>L.push((i+1)+'. '+x.q+(x.a?'\n   答：'+x.a:'')));}
  return L.join('\n');
}
/* 结构化渲染（课程详情页复用同一套卡片）；r 可被编辑引擎写回 */
function aiStudyBody(r){

function irInsertNewline(el){
  try{if(document.execCommand('insertText',false,'\n'))return;}catch(ignore){}
  if(el.setRangeText){const s=el.selectionStart??el.value.length,ep=el.selectionEnd??s;el.setRangeText('\n',s,ep,'end');}
  else if(el.isContentEditable){const sel=getSelection(),r=sel.getRangeAt(0);r.deleteContents();r.insertNode(document.createTextNode('\n'));sel.collapseToEnd();}
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
  const t=e.target;if(!t||!t.closest)return;
  const zone=t.closest('.modal,.ja-panel,.v4-form');if(!zone)return;
  const isField=t.tagName==='TEXTAREA'||t.isContentEditable
    ||(t.tagName==='INPUT'&&!/^(checkbox|radio|file|range|color|date|time|datetime-local|button|submit|reset)$/i.test(t.getAttribute('type')||'text'));
  if(!isField)return;
  if(e.ctrlKey||e.metaKey){e.preventDefault();irInsertNewline(t);return;}
  if(e.shiftKey)return;
  e.preventDefault();
  const save=zone.querySelector('#mOk:not([disabled]),.v4-save:not([disabled])')
    ||[...zone.querySelectorAll('button')].find(b=>!b.disabled&&!b.classList.contains('modal-close-x')&&!b.classList.contains('round-pill-ir')&&/^(保存|创建|生成|确定|✦ 保存并 AI 分析)/.test(b.textContent.trim()));

 /* 文件 → 纯文本（PDF / Word / PPT / TXT，可拼接） */
 const resumeReadText=async(file,prev)=>{
  if(file.size>10*1024*1024)throw Error('文件超过 10 MB，请精简后再导入');
  let text='';
  const name=file.name.toLowerCase();
  if(/\.pdf$/.test(name))text=await resumeParsePdf(file);
  else if(/\.docx$/.test(name))text=await resumeParseDocx(file);
  else if(/\.pptx?$/.test(name))text=await resumeParseSlides(file);
  else{
   text=await file.text();
   if(/\.md$/.test(name))text=text.replace(/^#{1,6}\s/gm,'').replace(/\*\*/g,'');
  }
  text=text.replace(/\n{3,}/g,'\n\n').trim();
  if(!text)throw Error('没有解析出文字内容');
  return prev&&prev.trim()?prev.replace(/\s+$/,'')+'\n\n'+text:text;
 };
 const resumeParsePdf=async file=>{
  if(!window.pdfjsLib)throw Error('PDF 组件未加载，请刷新页面重试');
  pdfjsLib.GlobalWorkerOptions.workerSrc='./pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let out='';
  for(let i=1;i<=pdf.numPages;i++){
   const page=await pdf.getPage(i),tc=await page.getTextContent();
   out+=tc.items.map(x=>x.str).join(' ')+'\n\n';
  }
  return out;
 };
 const resumeParseDocx=async file=>{
  if(!window.mammoth)throw Error('Word 解析组件未加载，请刷新页面重试');

 };
 const resumeParseSlides=async file=>{
  if(!window.JSZip)throw Error('PPT 解析组件未加载，请刷新页面重试');
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  if(!names.length)throw Error('这不是有效的 PPT 文件（老版本 .doc/.ppt 请先另存为新格式）');
  let out='';
  for(let i=0;i<names.length;i++){
   const xml=await zip.files[names[i]].async('string');
   const texts=[...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).filter(t=>t.trim());
   if(texts.length)out+='【第 '+(i+1)+' 页】'+texts.join(' ')+'\n\n';

 };

/* 结构化简历 → 纯文本（编辑卡片后同步，岗位分析用它） */
function aiResumeText(s){
 const L=[s.title||'个人简历'];
 if(s.direction)L.push('求职方向：'+s.direction);
 if(s.summary)L.push('',s.summary);
 (s.groups||[]).forEach(g=>{
  L.push('',g.name+'：');
  g.items.forEach(it=>{L.push('- '+it.title+(it.org?'（'+it.org+'）':'')+(it.when?' '+it.when:''));it.points.forEach(p=>L.push('  · '+p));});
 });
 if(s.skills&&s.skills.length)L.push('','技能：'+s.skills.join('、'));
 return L.join('\n');
}

function evalFabCheck(reqs,input){
  const src=evalNorm(input);
  return (Array.isArray(reqs)?reqs:[]).filter(q=>{
    const t=evalNorm(q&&q.title),e=evalNorm(q&&q.evidence);
    /* evidence 是必须逐字来自原文的锚点，优先用它；title 是归纳性短语，只作兜底 */

    return !(src.includes(probe)||src.includes(probe.slice(0,Math.min(8,probe.length))));
  });
}

async function evalStart(refresh){
  if(evalState.running)return;
  evalState.running=true;evalState.doneCount=0;
  evalState.results=EVAL_CASES.map(()=>({status:'run',detail:'排队中'}));
  refresh();
  const his=evalHistory();const prev=his.length?his[his.length-1]:null;
  for(let i=0;i<EVAL_CASES.length;i++){
    const c=EVAL_CASES[i];
    evalState.results[i]={status:'run',detail:'进行中'};evalState.doneCount=i+1;refresh();
    let out;
    if(c.kind==='local'){try{out=c.run();}catch(e){out={pass:false,detail:'执行异常：'+e.message};}}
    else{
      try{
        let r;
        if(c.useStd){const std=matchStandardJobs(c.useStd).list[0];if(!std){out={pass:false,detail:'参考库未命中 '+c.useStd};}else{r=await callAI(c.task,'岗位：'+std.job+'\n参考能力：'+JSON.stringify(std.abilities)+'\n原参考方案（供润色参考）：'+std.plan);out=c.judge(r,std);}}
        else{r=await callAI(c.task,c.input);out=c.judge(r,c.input);}
      }catch(e){out={pass:false,detail:'调用失败：'+aiErrorText(e)};}
      await new Promise(res=>setTimeout(res,800));
    }
    const old=prev&&Array.isArray(prev.results)?prev.results.find(x=>x.id===c.id):null;
    const vs=old?(old.pass&&!out.pass?'比上次退步':(!old.pass&&out.pass?'比上次恢复':'与上次持平')):'首次';
    evalState.results[i]={status:out.pass?'pass':'fail',detail:'['+vs+'] '+out.detail};
    refresh();
  }
  const passed=evalState.results.filter(x=>x.status==='pass').length;
  evalSaveRun({time:Date.now(),total:EVAL_CASES.length,passed,results:EVAL_CASES.map((c,i)=>({id:c.id,pass:evalState.results[i].status==='pass',detail:evalState.results[i].detail}))});
  evalState.running=false;refresh();
  toast('体检完成：'+passed+'/'+EVAL_CASES.length+' 通过');
}

    exp.textContent='导出记录（JSON）';
    exp.onclick=()=>{const data=evalHistory();if(!data.length){toast('还没有记录可导出');return;}
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='拾级-体检记录-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      toast('已导出 '+data.length+' 次记录');};
    foot.append(exp);
  }
  refresh();
  wrap.append(list,foot);
  return wrap;
}
const evalOldMain=renderMain;
renderMain=function(){if(ui.view!=='eval'||ui.search.trim())return evalOldMain();const el=document.createElement('main');el.className='main';const inner=document.createElement('div');inner.className='main-inner';inner.append(renderEvalView());el.append(inner);return el;};
if(location.hash==='#eval')ui.view='eval';
window.addEventListener('hashchange',()=>{const toEval=location.hash==='#eval';if(toEval&&ui.view!=='eval'){ui.view='eval';render();}else if(!toEval&&ui.view==='eval'){ui.view='all';render();}});
/* Chromium 内核不会把 if/else 块内的 async function 挂到 window，手动暴露给 v4.2 主脚本 */
window.aiTextJd=aiTextJd;window.aiVisionJd=aiVisionJd;
/* AI 卡片 2.0 组件同样在块内：const 不会泄漏到全局，显式导出给课程详情页与岗位分析弹窗 */
window.aiSec=aiSec;window.aiRowH=aiRowH;window.aiBadgeH=aiBadgeH;
window.aiStudyBody=aiStudyBody;window.aiStudyText=aiStudyText;window.aiTreeEl=aiTreeEl;window.aiStudyCard=aiStudyCard;
window.aiEdBind=aiEdBind;window.aiEdSave=aiEdSave;window.aiReviewText=aiReviewText;
window.irInterviewBody=irInterviewBody;window.AI_TONE=AI_TONE;
window.AI_TASKS=AI_TASKS;window.callAI=callAI;window.aiErrorText=aiErrorText;
/* 兜底：loadState 的首次渲染可能趁 SDK 下载间隙执行（早于本脚本注册侧边栏入口），这里补一次渲染 */
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>render());
else render();
}
