<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记事助手 · 分类空间</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --paper:#EEF1EF; --card:#FBFCFA; --ink:#1E2A26; --ink-soft:#5C6B65; --line:#D6DAD2;
  --accent:#3D5A80; --accent-warm:#BC6C25;
  --cat-job:#3D5A80; --cat-company:#6A7F5C; --cat-interview:#BC6C25; --cat-referral:#7B5EA7;
  --cat-learning:#2F7A72; --cat-life:#8C7B6B; --cat-custom:#9C5B54; --cat-worklog:#4A6FA5; --cat-unfiled:#9AA39C;
  --stage-pending:#8C7B6B; --stage-applied:#3D5A80; --stage-interview:#BC6C25;
  --stage-waiting:#7B5EA7; --stage-offer:#2F7A72; --stage-closed:#9AA39C;
  --danger:#B0413E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Source Serif 4',serif;min-height:100vh;}
button,input,textarea,select{font-family:inherit;}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}

/* Sidebar */
.sidebar{border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;}
.brand{font-family:'Fraunces',serif;font-size:21px;font-weight:600;letter-spacing:-0.01em;cursor:pointer;}
.brand-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px;}
.search-box{position:relative;}
.search-box input{width:100%;padding:8px 10px 8px 28px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:13px;color:var(--ink);outline:none;}
.search-box input:focus{border-color:var(--accent);}
.search-box svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--ink-soft);}

.eyebrow{display:flex;align-items:center;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}
.eyebrow button{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;line-height:1;}
.eyebrow button:hover{color:var(--accent);}

.item-list{display:flex;flex-direction:column;gap:1px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink);border:none;background:transparent;width:100%;text-align:left;transition:background .12s;}
.nav-item:hover{background:rgba(0,0,0,0.04);}
.nav-item.active{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.nav-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);}
.nav-badge{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--ink-soft);border:1px solid var(--line);border-radius:8px;padding:0 5px;}
.nav-del{opacity:0;font-size:12px;color:var(--danger);padding:0 2px;}
.nav-item:hover .nav-del{opacity:0.6;}
.nav-del:hover{opacity:1 !important;}

.sep{height:1px;background:var(--line);margin:2px 0;}

.module-card{border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;background:var(--card);transition:box-shadow .12s;}
.module-card:hover{box-shadow:0 0 0 1px var(--accent);}
.module-card.active{box-shadow:0 0 0 1.5px var(--accent);background:#EAF0F7;}
.module-title{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);}
.module-sub{font-size:10px;color:var(--ink-soft);margin-top:2px;}

.data-mgmt{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line);}
.data-stat{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-soft);margin-bottom:2px;}
.data-btn{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 9px;cursor:pointer;background:var(--card);}
.data-btn:hover{border-color:var(--accent);}

/* Main */
.main{padding:28px 36px 60px;overflow-y:auto;}
.main-inner{max-width:820px;}
.view-head{display:flex;align-items:baseline;gap:9px;margin-bottom:2px;}
.view-title{font-family:'Fraunces',serif;font-size:21px;font-weight:600;}
.view-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
.view-hint{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-bottom:20px;}

.capture{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px;box-shadow:0 1px 2px rgba(30,42,38,0.04);transition:border-color .12s,background .12s;}
.capture.drag-over{border-color:var(--accent);background:#EAF0F7;}
.drop-hint{font-size:11px;color:var(--accent);text-align:center;padding:6px;border:1px dashed var(--accent);border-radius:7px;margin:0 6px;display:none;}
.capture.drag-over .drop-hint{display:block;}
.capture-row{display:flex;gap:8px;}
.capture textarea{flex:1;border:none;outline:none;resize:none;background:transparent;font-family:'Source Serif 4',serif;font-size:15px;color:var(--ink);padding:10px 8px;min-height:44px;line-height:1.5;}
.capture textarea::placeholder{color:#A3ADA6;}
.capture-actions{display:flex;align-items:center;gap:6px;padding:0 6px 4px;}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex-shrink:0;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.capture button.primary{align-self:flex-end;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:9px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.03em;cursor:pointer;white-space:nowrap;margin-left:auto;}
.capture button.primary:hover{background:var(--accent);}
.capture button.primary:disabled{background:#B7BDB8;cursor:default;}
.img-thumbs{display:flex;gap:6px;flex-wrap:wrap;padding:0 8px;}
.img-thumb{position:relative;width:52px;height:52px;border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.img-thumb img{width:100%;height:100%;object-fit:cover;}
.img-thumb .rm{position:absolute;top:1px;right:1px;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;width:15px;height:15px;font-size:10px;line-height:15px;cursor:pointer;}

.newdoc-row{display:flex;justify-content:flex-end;margin-bottom:16px;}
.ghost-btn{font-size:11.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;background:transparent;}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent);}

.suggest-banner{border:1px solid var(--accent);border-radius:9px;padding:11px 14px;margin-bottom:16px;background:#EAF0F7;}
.suggest-text{font-size:12.5px;color:var(--ink);margin-bottom:8px;}
.suggest-actions{display:flex;gap:7px;flex-wrap:wrap;}
.suggest-actions button{font-size:11px;padding:5px 11px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--card);}
.suggest-actions button.pri{background:var(--ink);color:var(--paper);border:none;}

.entries{display:flex;flex-direction:column;gap:12px;}
.entry{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;border-left:3px solid var(--cat-life);}
.entry-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
.entry-time{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
.entry-tag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;color:#fff;letter-spacing:0.02em;}
.entry-folder{font-size:10px;color:var(--ink-soft);background:var(--paper);border-radius:10px;padding:2px 7px;}
.entry-actions{margin-left:auto;display:flex;gap:4px;}
.entry-actions span{font-size:11px;color:var(--ink-soft);cursor:pointer;padding:2px 5px;}
.entry-actions span:hover{color:var(--accent);}
.entry-title{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.entry-body{font-size:13px;color:var(--ink-soft);line-height:1.55;white-space:pre-wrap;}
.entry-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.entry-imgs img{width:78px;height:78px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;}
.lightbox-mask{position:fixed;inset:0;background:rgba(10,14,12,0.82);display:flex;align-items:center;justify-content:center;z-index:200;cursor:zoom-out;padding:30px;}
.lightbox-mask img{max-width:90vw;max-height:88vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.4);}
.lightbox-close{position:absolute;top:18px;right:24px;color:#fff;font-size:22px;background:none;border:none;cursor:pointer;}
.empty{color:var(--ink-soft);font-size:13px;padding:30px 0;text-align:center;}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
.kcol{min-width:200px;flex-shrink:0;}
.kcol-head{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:#fff;padding:6px 10px;border-radius:7px 7px 0 0;}
.kcol-body{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 9px 9px;min-height:80px;padding:8px;display:flex;flex-direction:column;gap:8px;}
.jcard{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12.5px;cursor:pointer;}
.jcard:hover{border-color:var(--accent);}
.jcard .co{font-weight:600;margin-bottom:2px;}
.jcard .role{color:var(--ink-soft);font-size:11.5px;}
.jcard select{margin-top:6px;width:100%;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:3px;}
.add-job{border:1px dashed var(--line);border-radius:8px;padding:8px;text-align:center;font-size:11.5px;color:var(--ink-soft);cursor:pointer;}
.add-job:hover{border-color:var(--accent);color:var(--accent);}

/* Worklog */
.day-group{margin-bottom:16px;}
.day-label{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;}

/* Courses */
.course-grid{display:flex;flex-direction:column;gap:10px;}
.course-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;}
.course-card:hover{border-color:var(--accent);}
.course-card .cname{font-size:14.5px;font-weight:600;}
.course-card .ccount{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.step-block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.step-title{font-size:14px;font-weight:600;margin-bottom:6px;}
.step-content{font-size:12.5px;color:var(--ink-soft);line-height:1.6;white-space:pre-wrap;margin-bottom:8px;}
.step-img{max-width:220px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;}
.mindmap-btn{font-size:11.5px;border:1px solid var(--accent);color:var(--accent);border-radius:7px;padding:6px 12px;cursor:pointer;background:var(--card);margin-bottom:14px;}
.mindmap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;overflow-x:auto;}
.mm-root{font-family:'Fraunces',serif;font-weight:600;font-size:15px;background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;display:inline-block;margin-bottom:16px;}
.mm-branches{display:flex;gap:14px;flex-wrap:wrap;}
.mm-node{border:1.5px solid var(--accent-warm);border-radius:8px;padding:8px 12px;font-size:12px;max-width:170px;background:#FBF3EA;}

/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(20,26,24,0.45);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal{background:var(--card);border-radius:12px;padding:20px;width:360px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,0.2);}
.modal h3{font-family:'Fraunces',serif;font-size:16px;margin-bottom:12px;}
.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px;margin-bottom:10px;background:var(--paper);}
.modal textarea{min-height:70px;resize:vertical;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
.modal-actions button{font-size:12px;padding:7px 14px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:transparent;}
.modal-actions button.pri{background:var(--ink);color:var(--paper);border:none;}
.mstat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.mstat{background:var(--paper);border-radius:7px;padding:8px;text-align:center;}
.mstat b{display:block;font-size:16px;}
.mstat span{font-size:10px;color:var(--ink-soft);}
.opt-row{border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.5px;cursor:pointer;margin-bottom:6px;}
.opt-row:hover{border-color:var(--accent);}
.opt-row.sel{border-color:var(--accent);background:#EAF0F7;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:8px;font-size:12.5px;z-index:100;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===================== 数据层 ===================== */
const BUILTIN_FOLDERS = [
  {id:'f_job', name:'职位机会', builtin:true},
  {id:'f_company', name:'公司资料', builtin:true},
  {id:'f_interview', name:'面试准备', builtin:true},
  {id:'f_referral', name:'内推人脉', builtin:true},
  {id:'f_learning', name:'学习资料', builtin:true},
  {id:'f_life', name:'生活杂项', builtin:true},
  {id:'f_worklog', name:'工作日志', builtin:true, isWorklog:true},
];
const STAGES = [
  {key:'待投递', color:'var(--stage-pending)'},
  {key:'已投递', color:'var(--stage-applied)'},
  {key:'面试中', color:'var(--stage-interview)'},
  {key:'待通知', color:'var(--stage-waiting)'},
  {key:'Offer', color:'var(--stage-offer)'},
  {key:'已结束', color:'var(--stage-closed)'},
];
const CAT_COLORS = {f_job:'var(--cat-job)',f_company:'var(--cat-company)',f_interview:'var(--cat-interview)',f_referral:'var(--cat-referral)',f_learning:'var(--cat-learning)',f_life:'var(--cat-life)',f_worklog:'var(--cat-worklog)',__unfiled__:'var(--cat-unfiled)'};
function colorFor(id){ return CAT_COLORS[id] || 'var(--cat-custom)'; }
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }

let state = { folders: JSON.parse(JSON.stringify(BUILTIN_FOLDERS)), items: [], jobs: [], courses: [], courseSteps: [] };
let ui = { view:'all', pendingImages:[], suggestion:null, modal:null, search:'' };

async function loadState(){
  try{
    const r = await window.storage.get('notes_app_data', false);
    if(r && r.value){
      const d = JSON.parse(r.value);
      state.folders = d.folders && d.folders.length ? d.folders : state.folders;
      state.items = d.items || [];
      state.jobs = d.jobs || [];
      state.courses = d.courses || [];
      state.courseSteps = d.courseSteps || [];
    }
  }catch(e){ /* 首次使用，没有历史数据 */ }
  render();
}
async function saveState(){
  try{
    await window.storage.set('notes_app_data', JSON.stringify(state), false);
  }catch(e){
    toast('保存失败，可能是存储容量已满，建议导出备份');
  }
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

/* ===================== 拖拽/粘贴图片通用绑定 ===================== */
function attachImageDrop(container, onFiles){
  let depth = 0;
  container.addEventListener('dragenter', e=>{
    if(!e.dataTransfer || ![...e.dataTransfer.items||[]].some(it=>it.kind==='file')) return;
    e.preventDefault(); depth++; container.classList.add('drag-over');
  });
  container.addEventListener('dragover', e=>{ e.preventDefault(); });
  container.addEventListener('dragleave', e=>{
    depth = Math.max(0, depth-1);
    if(depth===0) container.classList.remove('drag-over');
  });
  container.addEventListener('drop', e=>{
    e.preventDefault(); depth=0; container.classList.remove('drag-over');
    const files = [...(e.dataTransfer.files||[])].filter(f=>f.type.startsWith('image/'));
    if(files.length) onFiles(files);
  });
  // 顺带支持粘贴截图/图片
  container.addEventListener('paste', e=>{
    const files = [...(e.clipboardData?.items||[])].filter(it=>it.kind==='file' && it.type.startsWith('image/')).map(it=>it.getAsFile());
    if(files.length){ onFiles(files); }
  });
}

/* ===================== 图片压缩 ===================== */
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1000;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ===================== AI 分类（调用 Claude） ===================== */
async function aiClassify(text){
  const folderList = state.folders.filter(f=>!f.isWorklog).map(f=>({id:f.id,name:f.name}));
  const prompt = `你是笔记分类助手。已有文件夹列表（JSON）：${JSON.stringify(folderList)}\n用户新写了一条速记："${text}"\n请判断这条内容最适合归入哪个已有文件夹。如果有合适的，只返回 {"folderId":"对应id"}；如果和所有文件夹都不太像，返回 {"folderId":null,"suggestedName":"一个简短贴切的新文件夹名"}。只返回JSON，不要任何其他文字。`;
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:200, messages:[{role:'user', content:prompt}] })
    });
    const data = await resp.json();
    const raw = (data.content||[]).map(c=>c.text||'').join('');
    const clean = raw.replace(/```json|```/g,'').trim();
    return JSON.parse(clean);
  }catch(e){
    return {folderId:null, suggestedName:null};
  }
}

/* ===================== 渲染 ===================== */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderSidebar());
  app.appendChild(renderMain());
  document.querySelectorAll('.modal-mask').forEach(el=>el.remove());
  if(ui.modal) document.body.appendChild(renderModal());
}

function folderCount(fid){
  if(fid==='__unfiled__') return state.items.filter(i=>!i.folderId || i.folderId==='__unfiled__').length;
  return state.items.filter(i=>i.folderId===fid).length;
}

function renderSidebar(){
  const el = document.createElement('div');
  el.className='sidebar';

  el.innerHTML = `
    <div>
      <div class="brand" id="goAll">记事助手</div>
      <div class="brand-sub">分类空间</div>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="搜索速记/文档..." value="${escapeAttr(ui.search)}">
    </div>
    <div>
      <div class="eyebrow"><span>文件夹</span><button id="addFolderBtn" title="新建文件夹">+</button></div>
      <div class="item-list" id="folderList"></div>
    </div>
    <div class="sep"></div>
    <div>
      <div class="eyebrow"><span>独立模块</span></div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div class="module-card ${ui.view==='jobs'?'active':''}" data-view="jobs">
          <div class="module-title">📋 求职追踪</div>
          <div class="module-sub">独立数据源 · 状态看板</div>
        </div>
        <div class="module-card ${ui.view==='worklog'?'active':''}" data-view="worklog">
          <div class="module-title">🕐 工作日志 · 时间轴</div>
          <div class="module-sub">与「工作日志」文件夹同源</div>
        </div>
        <div class="module-card ${ui.view==='courses'?'active':''}" data-view="courses">
          <div class="module-title">🗂 课程记录</div>
          <div class="module-sub">分步教程 · 一键生成思维导图</div>
        </div>
      </div>
    </div>
    <div class="data-mgmt">
      <div class="data-stat" id="storageStat">共 ${state.items.length + state.jobs.length + state.courseSteps.length} 条内容</div>
      <div class="data-btn" id="exportJsonBtn">⬇ 导出备份（.json）</div>
      <div class="data-btn" id="importJsonBtn">⬆ 导入备份</div>
      <div class="data-btn" id="exportPdfBtn">📄 导出为 PDF</div>
      <div class="data-btn" id="exportWordBtn">📝 导出为 Word</div>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  `;

  const folderListEl = el.querySelector('#folderList');
  const allRow = navItem('all','全部',state.items.length,'#8C7B6B',null,false);
  folderListEl.appendChild(allRow);
  state.folders.forEach(f=>{
    const row = navItem('folder:'+f.id, f.name + (f.isWorklog?' 🕐':''), folderCount(f.id), colorFor(f.id), f.builtin?null:f.id, !f.builtin);
    folderListEl.appendChild(row);
  });
  const unfiledRow = navItem('folder:__unfiled__','未分类', folderCount('__unfiled__'), colorFor('__unfiled__'), null, false);
  folderListEl.appendChild(unfiledRow);

  el.querySelector('#goAll').onclick=()=>{ui.view='all'; render();};
  el.querySelector('#addFolderBtn').onclick=()=>{ui.modal={type:'newFolder', name:''}; render();};
  el.querySelectorAll('.module-card').forEach(c=>c.onclick=()=>{ui.view=c.dataset.view; render();});
  el.querySelector('#searchInput').oninput=(e)=>{ui.search=e.target.value; render();};
  el.querySelector('#exportJsonBtn').onclick=exportBackup;
  el.querySelector('#importJsonBtn').onclick=()=>el.querySelector('#importFile').click();
  el.querySelector('#importFile').onchange=handleImportFile;
  el.querySelector('#exportPdfBtn').onclick=()=>{ui.modal={type:'exportScope', format:'pdf'}; render();};
  el.querySelector('#exportWordBtn').onclick=()=>{ui.modal={type:'exportScope', format:'word'}; render();};

  return el;
}

function navItem(viewKey,label,count,color,delId,showDel){
  const b = document.createElement('button');
  b.className='nav-item'+(ui.view===viewKey?' active':'');
  b.innerHTML = `<span class="nav-dot" style="background:${color}"></span><span>${escapeHtml(label)}</span><span class="nav-count">${count}</span>${showDel?'<span class="nav-del">✕</span>':''}`;
  b.onclick=(e)=>{
    if(e.target.classList.contains('nav-del')){
      e.stopPropagation();
      if(confirm('删除该文件夹？内容会移入"未分类"')){
        state.items.forEach(i=>{ if(i.folderId===delId) i.folderId='__unfiled__'; });
        state.folders = state.folders.filter(f=>f.id!==delId);
        saveState(); render();
      }
      return;
    }
    ui.view = viewKey; ui.suggestion=null; render();
  };
  return b;
}

function renderMain(){
  const el = document.createElement('div');
  el.className='main';
  const inner = document.createElement('div');
  inner.className='main-inner';
  el.appendChild(inner);

  if(ui.view==='jobs') inner.appendChild(renderJobsView());
  else if(ui.view==='worklog') inner.appendChild(renderWorklogView());
  else if(ui.view==='courses') inner.appendChild(renderCoursesView());
  else inner.appendChild(renderFolderView());

  return el;
}

/* ---------- 文件夹 / 全部 视图 ---------- */
function renderFolderView(){
  const isAll = ui.view==='all';
  const folderId = isAll?null:ui.view.split(':')[1];
  const folder = folderId ? (folderId==='__unfiled__'?{id:'__unfiled__',name:'未分类'}:state.folders.find(f=>f.id===folderId)) : null;
  const title = isAll?'全部':folder.name;

  let list = state.items.filter(i=>{
    if(!isAll){
      if(folderId==='__unfiled__') return !i.folderId || i.folderId==='__unfiled__';
      return i.folderId===folderId;
    }
    return true;
  });
  if(ui.search){
    const q = ui.search.toLowerCase();
    list = list.filter(i=> (i.title||'').toLowerCase().includes(q) || (i.rawText||'').toLowerCase().includes(q));
  }
  list = list.slice().sort((a,b)=> (b.updatedAt||b.timestamp) - (a.updatedAt||a.timestamp));

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="view-head"><span class="view-title">${escapeHtml(title)}</span><span class="view-count">${list.length} 条</span></div>
    <div class="view-hint">${isAll?'AI 只从已有文件夹里挑最匹配的，挑不出来才会建议新建':'速记与文档混排 · 按最近更新排序'}</div>
    <div class="capture" id="captureBox">
      <div class="capture-row">
        <textarea id="captureText" placeholder="${isAll?'随手记点什么，AI 会帮你归类...':'记到「'+escapeAttr(title)+'」里...'}"></textarea>
      </div>
      <div class="drop-hint">松开鼠标即可添加图片</div>
      <div class="img-thumbs" id="imgThumbs"></div>
      <div class="capture-actions">
        <label class="icon-btn" title="添加图片">📷<input type="file" id="imgInput" accept="image/*" multiple style="display:none"></label>
        <button class="primary" id="captureBtn">速记</button>
      </div>
    </div>
    <div id="suggestSlot"></div>
    <div class="newdoc-row"><span class="ghost-btn" id="newDocBtn">+ 新建文档</span></div>
    <div class="entries" id="entriesSlot"></div>
  `;

  const imgThumbs = wrap.querySelector('#imgThumbs');
  function renderThumbs(){
    imgThumbs.innerHTML='';
    ui.pendingImages.forEach((src,idx)=>{
      const d = document.createElement('div'); d.className='img-thumb';
      d.innerHTML = `<img src="${src}"><button class="rm">×</button>`;
      d.querySelector('.rm').onclick=()=>{ui.pendingImages.splice(idx,1); renderThumbs();};
      imgThumbs.appendChild(d);
    });
  }
  renderThumbs();
  wrap.querySelector('#imgInput').onchange = async (e)=>{
    for(const f of e.target.files){ const b64 = await compressImage(f); ui.pendingImages.push(b64); }
    renderThumbs();
  };
  attachImageDrop(wrap.querySelector('#captureBox'), async (files)=>{
    for(const f of files){ const b64 = await compressImage(f); ui.pendingImages.push(b64); }
    renderThumbs();
  });

  wrap.querySelector('#captureBtn').onclick = async ()=>{
    const ta = wrap.querySelector('#captureText');
    const text = ta.value.trim();
    if(!text && ui.pendingImages.length===0) return;
    const btn = wrap.querySelector('#captureBtn');
    btn.disabled = true; btn.textContent='处理中...';

    let targetFolder = isAll ? null : folderId;
    if(isAll && text){
      const res = await aiClassify(text);
      if(res && res.folderId){
        targetFolder = res.folderId;
      } else {
        // 无匹配，弹出建议条，先暂存
        ui.suggestion = { text, images: ui.pendingImages.slice(), suggestedName: (res && res.suggestedName) || '新分类' };
        ui.pendingImages = [];
        render();
        return;
      }
    }
    addItem('note', targetFolder||'__unfiled__', null, text, ui.pendingImages);
    ui.pendingImages = [];
    render();
  };

  wrap.querySelector('#newDocBtn').onclick = ()=>{
    ui.modal = { type:'newDoc', folderId: isAll? (state.folders[0]?.id||'__unfiled__') : folderId, title:'', body:'' };
    render();
  };

  // suggestion banner (全部视图专用)
  if(isAll && ui.suggestion){
    const s = ui.suggestion;
    const banner = document.createElement('div');
    banner.className='suggest-banner';
    banner.innerHTML = `
      <div class="suggest-text">这条内容跟已有文件夹都不太像，要不要新建「${escapeHtml(s.suggestedName)}」？</div>
      <div class="suggest-actions">
        <button class="pri" id="sugCreate">新建并归入</button>
        <button id="sugPick">改选已有文件夹</button>
        <button id="sugUnfiled">先放未分类</button>
      </div>
    `;
    wrap.querySelector('#suggestSlot').appendChild(banner);
    banner.querySelector('#sugCreate').onclick=()=>{
      const nf = {id:uid('f'), name:s.suggestedName, builtin:false};
      state.folders.push(nf);
      addItem('note', nf.id, null, s.text, s.images);
      ui.suggestion=null; render();
    };
    banner.querySelector('#sugUnfiled').onclick=()=>{
      addItem('note','__unfiled__', null, s.text, s.images);
      ui.suggestion=null; render();
    };
    banner.querySelector('#sugPick').onclick=()=>{
      ui.modal={type:'pickFolder', text:s.text, images:s.images};
      ui.suggestion=null; render();
    };
  }

  const entriesSlot = wrap.querySelector('#entriesSlot');
  if(list.length===0){
    entriesSlot.innerHTML = '<div class="empty">还没有内容，从上方开始记录吧</div>';
  } else {
    list.forEach(item=> entriesSlot.appendChild(renderEntry(item)));
  }
  return wrap;
}

function renderEntry(item){
  const f = state.folders.find(f=>f.id===item.folderId);
  const fname = item.folderId==='__unfiled__' || !item.folderId ? '未分类' : (f?f.name:'未分类');
  const color = colorFor(item.folderId);
  const d = new Date(item.updatedAt||item.timestamp);
  const timeStr = `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const div = document.createElement('div');
  div.className='entry';
  div.style.borderLeftColor = color;
  div.innerHTML = `
    <div class="entry-top">
      <span class="entry-time">${timeStr}</span>
      <span class="entry-tag" style="background:${color}">${item.type==='doc'?'文档':'速记'}</span>
      <span class="entry-folder">${escapeHtml(fname)}</span>
      <span class="entry-actions"><span data-act="edit">编辑</span><span data-act="del">删除</span></span>
    </div>
    ${item.title?`<div class="entry-title">${escapeHtml(item.title)}</div>`:''}
    <div class="entry-body">${escapeHtml(item.rawText||'')}</div>
    ${item.images&&item.images.length?`<div class="entry-imgs">${item.images.map(s=>`<img src="${s}">`).join('')}</div>`:''}
  `;
  div.querySelector('[data-act="del"]').onclick=()=>{
    if(confirm('删除这条内容？')){ state.items = state.items.filter(i=>i.id!==item.id); saveState(); render(); }
  };
  div.querySelector('[data-act="edit"]').onclick=()=>{
    ui.modal = { type:'editItem', item };
    render();
  };
  return div;
}

function addItem(type, folderId, title, rawText, images){
  state.items.push({ id:uid('i'), type, folderId, title, rawText, images: images||[], timestamp:Date.now(), updatedAt:Date.now() });
  saveState();
}

/* ---------- 求职追踪 ---------- */
function renderJobsView(){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="view-head"><span class="view-title">求职追踪</span><span class="view-count">${state.jobs.length} 个岗位</span></div>
    <div class="view-hint">独立数据源 · 状态看板</div>
    <div class="kanban" id="kanban"></div>
  `;

  STAGES.forEach(st=>{
    const col = document.createElement('div'); col.className='kcol';

    col.innerHTML = `<div class="kcol-head" style="background:${st.color}">${st.key} · ${jobs.length}</div><div class="kcol-body"></div>`;
    const body = col.querySelector('.kcol-body');
    jobs.forEach(j=>{
      const c = document.createElement('div'); c.className='jcard';
      c.innerHTML = `<div class="co">${escapeHtml(j.company)}</div><div class="role">${escapeHtml(j.position||'')}</div>`;
      c.onclick=()=>{ ui.modal={type:'editJob', job:j}; render(); };

    });

      body.appendChild(add);
    }

/* ---------- 工作日志 · 时间轴 ---------- */
function renderWorklogView(){
  const folder = state.folders.find(f=>f.isWorklog);
  const list = state.items.filter(i=>i.folderId===folder.id).sort((a,b)=>(b.timestamp)-(a.timestamp));
  const groups = {};
  list.forEach(i=>{
    const d = new Date(i.timestamp);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    (groups[key] = groups[key]||[]).push(i);
  });
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="view-head"><span class="view-title">工作日志 · 时间轴</span><span class="view-count">${list.length} 条</span></div>
    <div class="view-hint">同一份内容，按日期分组展示，与「工作日志」文件夹同源</div>
    <div class="capture">
      <div class="capture-row"><textarea id="wlText" placeholder="记今天的一句话，会自动归到「工作日志」..."></textarea></div>
      <div class="capture-actions"><button class="primary" id="wlBtn">速记</button></div>
    </div>
    <div id="wlGroups"></div>
  `;
  wrap.querySelector('#wlBtn').onclick=()=>{
    const ta = wrap.querySelector('#wlText');
    if(!ta.value.trim()) return;
    addItem('note', folder.id, null, ta.value.trim(), []);
    render();
  };
  const gEl = wrap.querySelector('#wlGroups');
  const keys = Object.keys(groups).sort().reverse();
  if(keys.length===0){ gEl.innerHTML='<div class="empty">工作日志还是空的，写下今天做了什么吧</div>'; }
  keys.forEach(k=>{
    const g = document.createElement('div'); g.className='day-group';
    const d = new Date(k);
    const weekday = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    g.innerHTML = `<div class="day-label">${k.slice(5).replace('-','月')}日 · ${weekday}</div>`;
    const listWrap = document.createElement('div'); listWrap.style.display='flex'; listWrap.style.flexDirection='column'; listWrap.style.gap='6px';
    groups[k].forEach(item=>{
      const row = document.createElement('div'); row.className='entry'; row.style.padding='9px 12px'; row.style.borderLeftColor=colorFor(folder.id);
      row.innerHTML = `<div class="entry-body">${escapeHtml(item.rawText||'')}</div>`;
      listWrap.appendChild(row);
    });
    g.appendChild(listWrap);
    gEl.appendChild(g);
  });
  return wrap;
}

/* ---------- 课程记录 ---------- */
function renderCoursesView(){
  if(ui.courseDetail){
    return renderCourseDetail(ui.courseDetail);
  }
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="view-head"><span class="view-title">课程记录</span><span class="view-count">${state.courses.length} 门课程</span></div>
    <div class="view-hint">分步骤图文教程录入 · 一键生成思维导图</div>
    <div class="newdoc-row"><span class="ghost-btn" id="addCourseBtn">+ 新建课程</span></div>
    <div class="course-grid" id="courseGrid"></div>
  `;
  wrap.querySelector('#addCourseBtn').onclick=()=>{ ui.modal={type:'newCourse'}; render(); };
  const grid = wrap.querySelector('#courseGrid');
  if(state.courses.length===0){ grid.innerHTML='<div class="empty">还没有课程，新建一个开始记录吧</div>'; }
  state.courses.forEach(c=>{
    const n = state.courseSteps.filter(s=>s.courseId===c.id).length;
    const card = document.createElement('div'); card.className='course-card';
    card.innerHTML = `<div class="cname">${escapeHtml(c.name)}</div><div class="ccount">${n} 个功能点</div>`;
    card.onclick=()=>{ ui.courseDetail = c.id; render(); };
    grid.appendChild(card);
  });
  return wrap;
}

function renderCourseDetail(courseId){
  const course = state.courses.find(c=>c.id===courseId);
  const steps = state.courseSteps.filter(s=>s.courseId===courseId).sort((a,b)=>a.order-b.order);
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="view-head"><span class="ghost-btn" id="backBtn" style="margin-right:8px">← 返回</span><span class="view-title">${escapeHtml(course.name)}</span><span class="view-count">${steps.length} 个功能点</span></div>
    <div class="view-hint">记录操作步骤，可配图</div>
    <button class="mindmap-btn" id="genMindmap">生成思维导图</button>
    <div id="mindmapSlot"></div>
    <div class="newdoc-row"><span class="ghost-btn" id="addStepBtn">+ 新增步骤</span></div>
    <div id="stepList"></div>
  `;
  wrap.querySelector('#backBtn').onclick=()=>{ ui.courseDetail=null; render(); };
  wrap.querySelector('#addStepBtn').onclick=()=>{ ui.modal={type:'newStep', courseId, title:'', content:'', image:null}; render(); };
  wrap.querySelector('#genMindmap').onclick=()=>{
    const slot = wrap.querySelector('#mindmapSlot');
    slot.innerHTML = '';
    const mm = document.createElement('div'); mm.className='mindmap';
    mm.innerHTML = `<div class="mm-root">${escapeHtml(course.name)}</div><div class="mm-branches">${steps.map(s=>`<div class="mm-node"><b>${escapeHtml(s.title)}</b></div>`).join('')}</div>`;
    slot.appendChild(mm);
  };
  const listEl = wrap.querySelector('#stepList');
  if(steps.length===0){ listEl.innerHTML='<div class="empty">还没有步骤记录</div>'; }
  steps.forEach(s=>{
    const b = document.createElement('div'); b.className='step-block';
    b.innerHTML = `
      <div class="step-title">${escapeHtml(s.title)}</div>
      ${s.image?`<img class="step-img" src="${s.image}">`:''}
      <div class="step-content">${escapeHtml(s.content||'')}</div>
      <span class="ghost-btn" data-del>删除</span>
    `;
    b.querySelector('[data-del]').onclick=()=>{
      state.courseSteps = state.courseSteps.filter(x=>x.id!==s.id); saveState(); render();
    };
    listEl.appendChild(b);
  });
  return wrap;
}

/* ===================== 弹窗 ===================== */
function renderModal(){
  const mask = document.createElement('div');
  mask.className='modal-mask';
  mask.onclick=(e)=>{ if(e.target===mask){ ui.modal=null; render(); } };
  const m = document.createElement('div'); m.className='modal';
  mask.appendChild(m);
  const t = ui.modal.type;

  if(t==='newFolder'){
    m.innerHTML = `<h3>新建文件夹</h3><input id="mfName" placeholder="文件夹名称"><div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">创建</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const name = m.querySelector('#mfName').value.trim();
      if(!name) return;
      state.folders.push({id:uid('f'), name, builtin:false});
      saveState(); closeModal();
    };
  }
  else if(t==='pickFolder'){
    m.innerHTML = `<h3>选择文件夹</h3><div id="pfList"></div><div class="modal-actions"><button id="mCancel">取消</button></div>`;
    const list = m.querySelector('#pfList');
    state.folders.forEach(f=>{
      const row = document.createElement('div'); row.className='opt-row'; row.textContent=f.name;
      row.onclick=()=>{ addItem('note', f.id, null, ui.modal.text, ui.modal.images); closeModal(); };
      list.appendChild(row);
    });
    m.querySelector('#mCancel').onclick=closeModal;
  }
  else if(t==='newDoc'){
    const folderOpts = state.folders.map(f=>`<option value="${f.id}" ${f.id===ui.modal.folderId?'selected':''}>${escapeHtml(f.name)}</option>`).join('');
    m.innerHTML = `<h3>新建文档</h3>
      <select id="mfFolder">${folderOpts}</select>
      <input id="mfTitle" placeholder="标题">
      <textarea id="mfBody" placeholder="正文内容..." style="min-height:140px"></textarea>
      <div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">保存</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const title = m.querySelector('#mfTitle').value.trim();
      const body = m.querySelector('#mfBody').value.trim();
      if(!title && !body) return closeModal();
      addItem('doc', m.querySelector('#mfFolder').value, title, body, []);
      closeModal();
    };
  }
  else if(t==='editItem'){
    const item = ui.modal.item;
    const folderOpts = [{id:'__unfiled__',name:'未分类'}].concat(state.folders).map(f=>`<option value="${f.id}" ${f.id===(item.folderId||'__unfiled__')?'selected':''}>${escapeHtml(f.name)}</option>`).join('');
    m.innerHTML = `<h3>编辑</h3>
      <label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">所属文件夹</label>
      <select id="mfFolder">${folderOpts}</select>
      <input id="mfTitle" placeholder="标题（可选）" value="${escapeAttr(item.title||'')}">
      <textarea id="mfBody" style="min-height:140px">${escapeHtml(item.rawText||'')}</textarea>
      ${item.images&&item.images.length?`<div class="img-thumbs" style="margin-bottom:10px">${item.images.map(s=>`<div class="img-thumb"><img src="${s}"></div>`).join('')}</div>`:''}
      <div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">保存</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      item.folderId = m.querySelector('#mfFolder').value;
      item.title = m.querySelector('#mfTitle').value.trim();
      item.rawText = m.querySelector('#mfBody').value.trim();
      item.updatedAt = Date.now();
      saveState(); closeModal();
    };
  }
  else if(t==='newJob'){
    m.innerHTML = `<h3>新增求职意向</h3>
      <input id="mCo" placeholder="公司名称">
      <input id="mRole" placeholder="岗位名称">
      <textarea id="mNotes" placeholder="备注（可选）"></textarea>
      <div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">添加</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const co = m.querySelector('#mCo').value.trim();
      if(!co) return;
      state.jobs.push({id:uid('j'), company:co, position:m.querySelector('#mRole').value.trim(), stage:'待投递', notes:m.querySelector('#mNotes').value.trim(), createdAt:Date.now(), updatedAt:Date.now()});
      saveState(); closeModal();
    };
  }
  else if(t==='editJob'){
    const job = ui.modal.job;
    const stageOpts = STAGES.map(s=>`<option value="${s.key}" ${s.key===job.stage?'selected':''}>${s.key}</option>`).join('');
    m.innerHTML = `<h3>${escapeHtml(job.company)}</h3>
      <input id="mRole" value="${escapeAttr(job.position||'')}" placeholder="岗位名称">
      <select id="mStage">${stageOpts}</select>
      <textarea id="mNotes" placeholder="备注">${escapeHtml(job.notes||'')}</textarea>
      <div class="modal-actions"><button id="mDel" style="color:var(--danger)">删除</button><button id="mCancel">取消</button><button class="pri" id="mOk">保存</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mDel').onclick=()=>{ state.jobs=state.jobs.filter(j=>j.id!==job.id); saveState(); closeModal(); };
    m.querySelector('#mOk').onclick=()=>{
      job.position = m.querySelector('#mRole').value.trim();
      job.stage = m.querySelector('#mStage').value;
      job.notes = m.querySelector('#mNotes').value.trim();
      job.updatedAt = Date.now();
      saveState(); closeModal();
    };
  }
  else if(t==='newCourse'){
    m.innerHTML = `<h3>新建课程</h3><input id="mName" placeholder="课程名称，如 Premiere剪辑"><div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">创建</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const name = m.querySelector('#mName').value.trim();
      if(!name) return;
      const c = {id:uid('c'), name, createdAt:Date.now()};
      state.courses.push(c); saveState(); ui.courseDetail=c.id; closeModal();
    };
  }
  else if(t==='newStep'){
    m.innerHTML = `<h3>新增步骤</h3>
      <input id="mTitle" placeholder="步骤标题，如 蒙版转场怎么做">
      <textarea id="mContent" placeholder="操作说明..."></textarea>
      <label class="icon-btn" style="width:auto;padding:0 10px;display:inline-flex;gap:6px;">📷 添加图片<input type="file" id="mImg" accept="image/*" style="display:none"></label>
      <div class="drop-hint" style="display:block;margin-top:6px;">也可以直接拖拽图片到这里，或粘贴截图</div>
      <div id="mImgPreview" style="margin-top:8px"></div>
      <div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">保存</button></div>`;
    let imgData = null;
    const setImg = async (file)=>{ imgData = await compressImage(file); m.querySelector('#mImgPreview').innerHTML = `<img src="${imgData}" style="width:80px;border-radius:6px;">`; };
    m.querySelector('#mImg').onchange = async (e)=>{ if(e.target.files[0]) await setImg(e.target.files[0]); };
    attachImageDrop(m, async (files)=>{ if(files[0]) await setImg(files[0]); });
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const title = m.querySelector('#mTitle').value.trim();
      if(!title) return;
      const order = state.courseSteps.filter(s=>s.courseId===ui.modal.courseId).length;
      state.courseSteps.push({id:uid('st'), courseId:ui.modal.courseId, title, content:m.querySelector('#mContent').value.trim(), image:imgData, order, createdAt:Date.now()});
      saveState(); closeModal();
    };
  }
  else if(t==='exportScope'){
    const scopes = [
      {key:'folder', label:'单个文件夹（含图）'},
      {key:'worklog', label:'工作日志（近30天，按天分组）'},
      {key:'jobs', label:'求职追踪（状态汇总表）'},
      {key:'all', label:'全部内容'},
    ];
    m.innerHTML = `<h3>导出为 ${ui.modal.format==='pdf'?'PDF':'Word'}</h3><div id="scList"></div><div id="folderSubSel"></div><div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">生成</button></div>`;
    const list = m.querySelector('#scList');
    let selected = 'all';
    let selFolder = state.folders[0]?.id;
    scopes.forEach(s=>{
      const row = document.createElement('div'); row.className='opt-row'+(s.key===selected?' sel':''); row.textContent=s.label;
      row.onclick=()=>{ selected=s.key; list.querySelectorAll('.opt-row').forEach(r=>r.classList.remove('sel')); row.classList.add('sel');
        m.querySelector('#folderSubSel').innerHTML = s.key==='folder' ? `<select id="subFolder">${state.folders.map(f=>`<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('')}</select>` : '';
      };
      list.appendChild(row);
    });
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const fSel = m.querySelector('#subFolder');
      const folderId = fSel ? fSel.value : null;
      if(ui.modal.format==='pdf') exportPDF(selected, folderId); else exportWord(selected, folderId);
      closeModal();
    };
  }
  return mask;
}
function closeModal(){ ui.modal=null; render(); }

/* ===================== 导出 / 导入 ===================== */
function exportBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    version: 3,
    folders: state.folders,
    items: state.items,
    jobs: state.jobs,
    courses: state.courses,
    courseSteps: state.courseSteps,
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url; a.download = `记事助手备份_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('备份已下载');
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      ui.modal = { type:'importConfirm', data };
      render();
    }catch(err){ toast('文件格式不正确'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* 扩展导入确认弹窗 */
const _origRenderModal = renderModal;
renderModal = function(){
  if(ui.modal && ui.modal.type==='importConfirm'){
    const mask = document.createElement('div'); mask.className='modal-mask';
    const m = document.createElement('div'); m.className='modal'; mask.appendChild(m);
    const d = ui.modal.data;
    m.innerHTML = `<h3>导入备份</h3>
      <div class="mstat-grid">
        <div class="mstat"><b>${(d.folders||[]).length}</b><span>文件夹</span></div>
        <div class="mstat"><b>${(d.items||[]).length + (d.courseSteps||[]).length}</b><span>速记/文档</span></div>
        <div class="mstat"><b>${(d.jobs||[]).length}</b><span>求职记录</span></div>
      </div>
      <div class="opt-row" id="optMerge">合并（推荐）— 按内容 id 去重，只补齐缺失的</div>
      <div class="opt-row" id="optReplace">完全替换 — 用备份覆盖当前所有内容</div>
      <div class="modal-actions"><button id="mCancel">取消</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#optMerge').onclick=()=>{
      mergeBy(state.folders, d.folders); mergeBy(state.items, d.items); mergeBy(state.jobs, d.jobs);
      mergeBy(state.courses, d.courses); mergeBy(state.courseSteps, d.courseSteps);
      saveState(); toast('已合并导入'); closeModal();
    };
    m.querySelector('#optReplace').onclick=()=>{
      state.folders = d.folders||state.folders; state.items = d.items||[]; state.jobs = d.jobs||[];
      state.courses = d.courses||[]; state.courseSteps = d.courseSteps||[];
      saveState(); toast('已替换为备份内容'); closeModal();
    };
    return mask;
  }
  return _origRenderModal();
};
function mergeBy(target, incoming){
  if(!incoming) return;
  const ids = new Set(target.map(x=>x.id));
  incoming.forEach(x=>{ if(!ids.has(x.id)) target.push(x); });
}

/* ===================== PDF / Word 导出 ===================== */
function buildExportHTML(scope, folderId){
  let title = '记事助手导出';
  let body = '';
  const dateStr = new Date().toLocaleString('zh-CN');

  function itemBlock(i){
    const f = state.folders.find(f=>f.id===i.folderId);
    return `<div style="margin-bottom:18px;"><div style="font-family:Georgia,serif;font-size:16px;font-weight:600;margin-bottom:4px;">${escapeHtml(i.title||'(速记)')}</div>
      <div style="font-size:11px;color:#888;margin-bottom:6px;">${new Date(i.updatedAt||i.timestamp).toLocaleString('zh-CN')} ${f?'· '+escapeHtml(f.name):''}</div>
      ${(i.images||[]).map(s=>`<img src="${s}" style="max-width:320px;display:block;margin-bottom:6px;border:1px solid #ddd;">`).join('')}
      <div style="font-size:13px;color:#333;line-height:1.7;white-space:pre-wrap;">${escapeHtml(i.rawText||'')}</div></div>`;
  }

  if(scope==='folder'){
    const f = state.folders.find(x=>x.id===folderId);
    title = f.name;
    const items = state.items.filter(i=>i.folderId===folderId).sort((a,b)=>b.timestamp-a.timestamp);
    body = items.map(itemBlock).join('');
  } else if(scope==='worklog'){
    title = '工作日志';
    const f = state.folders.find(x=>x.isWorklog);
    const cutoff = Date.now() - 30*24*3600*1000;
    const items = state.items.filter(i=>i.folderId===f.id && i.timestamp>=cutoff).sort((a,b)=>b.timestamp-a.timestamp);
    const groups={};
    items.forEach(i=>{ const dd=new Date(i.timestamp); const k=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`; (groups[k]=groups[k]||[]).push(i); });
    body = Object.keys(groups).sort().reverse().map(k=>`<h3 style="font-size:14px;margin:14px 0 6px;">${k}</h3>` + groups[k].map(i=>`<div style="font-size:13px;margin-bottom:6px;">${escapeHtml(i.rawText||'')}</div>`).join('')).join('');
  } else if(scope==='jobs'){
    title = '求职追踪状态汇总';
    body = `<table style="width:100%;border-collapse:collapse;font-size:12.5px;">
      <tr style="background:#f0f0f0;"><th style="border:1px solid #ccc;padding:6px;text-align:left;">公司</th><th style="border:1px solid #ccc;padding:6px;text-align:left;">岗位</th><th style="border:1px solid #ccc;padding:6px;text-align:left;">状态</th><th style="border:1px solid #ccc;padding:6px;text-align:left;">备注</th></tr>
      ${state.jobs.map(j=>`<tr><td style="border:1px solid #ccc;padding:6px;">${escapeHtml(j.company)}</td><td style="border:1px solid #ccc;padding:6px;">${escapeHtml(j.position||'')}</td><td style="border:1px solid #ccc;padding:6px;">${escapeHtml(j.stage)}</td><td style="border:1px solid #ccc;padding:6px;">${escapeHtml(j.notes||'')}</td></tr>`).join('')}
    </table>`;
  } else {
    title = '全部内容';
    body = state.folders.map(f=>{
      const items = state.items.filter(i=>i.folderId===f.id).sort((a,b)=>b.timestamp-a.timestamp);
      if(items.length===0) return '';
      return `<h2 style="font-family:Georgia,serif;font-size:18px;border-bottom:1px solid #ccc;padding-bottom:4px;margin:20px 0 10px;">${escapeHtml(f.name)}</h2>` + items.map(itemBlock).join('');
    }).join('');
  }
  return `<html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title></head>
    <body style="font-family:Georgia,'Source Serif 4',serif;color:#1a1a1a;max-width:760px;margin:30px auto;">
      <h1 style="font-size:22px;">${escapeHtml(title)}</h1>
      <div style="font-size:11px;color:#888;margin-bottom:20px;">导出于 ${dateStr}</div>
      ${body || '<div style="color:#999;">暂无内容</div>'}
    </body></html>`;
}

function exportPDF(scope, folderId){
  const html = buildExportHTML(scope, folderId);
  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  setTimeout(()=>win.print(), 400);
}

function exportWord(scope, folderId){
  const html = buildExportHTML(scope, folderId);
  const wrapped = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>${html.slice(html.indexOf('<head'))}`;
  const blob = new Blob(['\ufeff', wrapped], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '记事助手导出.doc';
  a.click(); URL.revokeObjectURL(url);
  toast('Word 文档已下载');
}

/* ===================== 图片灯箱（点击放大查看） ===================== */
function openLightbox(src){
  const mask = document.createElement('div');
  mask.className='lightbox-mask';
  mask.innerHTML = `<button class="lightbox-close">×</button><img src="${src}">`;
  mask.onclick = ()=> mask.remove();
  document.body.appendChild(mask);
}
document.addEventListener('click', (e)=>{
  const img = e.target.closest('.entry-imgs img, .step-img, .img-thumb img');
  if(img && !e.target.closest('.rm')) openLightbox(img.src);
});

/* ===================== 工具函数 ===================== */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

loadState();
