<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记事助手 · 分类空间</title>
<style>
/* 不依赖 Google Fonts：使用下方声明中的系统后备字体，国内网络可直接加载。 */

:root{
  --paper:#EEF1EF; --card:#FBFCFA; --ink:#1E2A26; --ink-soft:#5C6B65; --line:#D6DAD2;
  --accent:#3D5A80; --accent-warm:#BC6C25;
  --cat-job:#3D5A80; --cat-company:#6A7F5C; --cat-interview:#BC6C25; --cat-referral:#7B5EA7;
  --cat-learning:#2F7A72; --cat-life:#8C7B6B; --cat-custom:#9C5B54; --cat-worklog:#4A6FA5; --cat-unfiled:#9AA39C;
  --stage-pending:#8C7B6B; --stage-applied:#3D5A80; --stage-interview:#BC6C25;
  --stage-waiting:#7B5EA7; --stage-offer:#2F7A72; --stage-closed:#9AA39C;
  --danger:#B0413E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Source Serif 4',serif;min-height:100vh;}
button,input,textarea,select{font-family:inherit;}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}

/* Sidebar */
.sidebar{border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;}
.brand{font-family:'Fraunces',serif;font-size:21px;font-weight:600;letter-spacing:-0.01em;cursor:pointer;}
.brand-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px;}
.search-box{position:relative;}
.search-box input{width:100%;padding:8px 10px 8px 28px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:13px;color:var(--ink);outline:none;}
.search-box input:focus{border-color:var(--accent);}
.search-box svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--ink-soft);}

.eyebrow{display:flex;align-items:center;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}
.eyebrow button{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;line-height:1;}
.eyebrow button:hover{color:var(--accent);}

.item-list{display:flex;flex-direction:column;gap:1px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink);border:none;background:transparent;width:100%;text-align:left;transition:background .12s;}
.nav-item:hover{background:rgba(0,0,0,0.04);}
.nav-item.active{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.nav-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);}
.nav-badge{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--ink-soft);border:1px solid var(--line);border-radius:8px;padding:0 5px;}
.nav-del{opacity:0;font-size:12px;color:var(--danger);padding:0 2px;}
.nav-item:hover .nav-del{opacity:0.6;}
.nav-del:hover{opacity:1 !important;}

.sep{height:1px;background:var(--line);margin:2px 0;}

.module-card{border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;background:var(--card);transition:box-shadow .12s;}
.module-card:hover{box-shadow:0 0 0 1px var(--accent);}
.module-card.active{box-shadow:0 0 0 1.5px var(--accent);background:#EAF0F7;}
.module-title{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);}
.module-sub{font-size:10px;color:var(--ink-soft);margin-top:2px;}

.data-mgmt{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line);}
.data-stat{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-soft);margin-bottom:2px;}
.data-btn{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 9px;cursor:pointer;background:var(--card);}
.data-btn:hover{border-color:var(--accent);}

/* Main */
.main{padding:28px 36px 60px;overflow-y:auto;}
.main-inner{max-width:820px;}
.view-head{display:flex;align-items:baseline;gap:9px;margin-bottom:2px;}
.view-title{font-family:'Fraunces',serif;font-size:21px;font-weight:600;}
.view-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
.view-hint{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-bottom:20px;}

.capture{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px;box-shadow:0 1px 2px rgba(30,42,38,0.04);transition:border-color .12s,background .12s;}
.capture.drag-over{border-color:var(--accent);background:#EAF0F7;}
.drop-hint{font-size:11px;color:var(--accent);text-align:center;padding:6px;border:1px dashed var(--accent);border-radius:7px;margin:0 6px;display:none;}
.capture.drag-over .drop-hint{display:block;}
.capture-row{display:flex;gap:8px;}
.capture textarea{flex:1;border:none;outline:none;resize:none;background:transparent;font-family:'Source Serif 4',serif;font-size:15px;color:var(--ink);padding:10px 8px;min-height:44px;line-height:1.5;}
.capture textarea::placeholder{color:#A3ADA6;}
.capture-actions{display:flex;align-items:center;gap:6px;padding:0 6px 4px;}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex-shrink:0;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.capture button.primary{align-self:flex-end;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:9px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.03em;cursor:pointer;white-space:nowrap;margin-left:auto;}
.capture button.primary:hover{background:var(--accent);}
.capture button.primary:disabled{background:#B7BDB8;cursor:default;}
.img-thumbs{display:flex;gap:6px;flex-wrap:wrap;padding:0 8px;}
.img-thumb{position:relative;width:52px;height:52px;border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.img-thumb img{width:100%;height:100%;object-fit:cover;}
.img-thumb .rm{position:absolute;top:1px;right:1px;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;width:15px;height:15px;font-size:10px;line-height:15px;cursor:pointer;}

.newdoc-row{display:flex;justify-content:flex-end;margin-bottom:16px;}
.ghost-btn{font-size:11.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;background:transparent;}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent);}
.bulk-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:11.5px;color:var(--ink-soft);}
.bulk-toolbar .bulk-count{margin-right:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;}
.bulk-btn{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;background:transparent;color:var(--ink-soft);}
.bulk-btn:hover{border-color:var(--accent);color:var(--accent);}
.bulk-btn.danger{border-color:#E5C4C1;color:var(--danger);}
.bulk-btn.danger:hover{background:#FBEDEC;border-color:var(--danger);}
.bulk-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}


.entries{display:flex;flex-direction:column;gap:12px;}
.entry{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;border-left:3px solid var(--cat-life);}
.entry-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
.entry-time{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
.entry-tag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;color:#fff;letter-spacing:0.02em;}
.entry-folder{font-size:10px;color:var(--ink-soft);background:var(--paper);border-radius:10px;padding:2px 7px;}
.entry-actions{margin-left:auto;display:flex;gap:4px;}
.entry-actions span{font-size:11px;color:var(--ink-soft);cursor:pointer;padding:2px 5px;}
.entry-actions span:hover{color:var(--accent);}
.entry-title{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.entry-body{font-size:13px;color:var(--ink-soft);line-height:1.55;white-space:pre-wrap;}
.entry-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.entry-imgs img{width:78px;height:78px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;}
.lightbox-mask{position:fixed;inset:0;background:rgba(10,14,12,0.82);display:flex;align-items:center;justify-content:center;z-index:200;cursor:zoom-out;padding:30px;}
.lightbox-mask img{max-width:90vw;max-height:88vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.4);}
.lightbox-close{position:absolute;top:18px;right:24px;color:#fff;font-size:22px;background:none;border:none;cursor:pointer;}
.empty{color:var(--ink-soft);font-size:13px;padding:30px 0;text-align:center;}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
.kcol{min-width:200px;flex-shrink:0;}
.kcol-head{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:#fff;padding:6px 10px;border-radius:7px 7px 0 0;}
.kcol-body{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 9px 9px;min-height:80px;padding:8px;display:flex;flex-direction:column;gap:8px;}
.jcard{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12.5px;cursor:pointer;}
.jcard:hover{border-color:var(--accent);}
.jcard .co{font-weight:600;margin-bottom:2px;}
.jcard .role{color:var(--ink-soft);font-size:11.5px;}
.jcard select{margin-top:6px;width:100%;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:3px;}
.jcard-meta{display:flex;align-items:center;gap:6px;margin-top:6px;}
.jcard-tag{font-size:10px;color:var(--ink-soft);background:var(--paper);border-radius:8px;padding:1px 7px;}
.jcard-link{font-size:11px;color:var(--accent);text-decoration:none;margin-left:auto;}
.jcard-link:hover{text-decoration:underline;}
.add-job{border:1px dashed var(--line);border-radius:8px;padding:8px;text-align:center;font-size:11.5px;color:var(--ink-soft);cursor:pointer;}
.add-job:hover{border-color:var(--accent);color:var(--accent);}

.job-stats{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--ink-soft);margin-bottom:14px;}
.job-stats b{color:var(--ink);font-weight:600;}
.job-search{position:relative;max-width:420px;margin-bottom:16px;}
.job-search input{width:100%;padding:9px 10px 9px 30px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:12.5px;color:var(--ink);outline:none;}
.job-search input:focus{border-color:var(--accent);}
.job-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--ink-soft);}
.job-form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:20px;}
.job-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.job-form-field label{display:block;font-size:10.5px;color:var(--ink-soft);margin-bottom:4px;}
.job-form-field input,.job-form-field select,.job-form-field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:12.5px;color:var(--ink);outline:none;}
.job-form-field textarea{min-height:50px;resize:vertical;}
.job-form-field input:focus,.job-form-field select:focus,.job-form-field textarea:focus{border-color:var(--accent);}
.job-form-actions{display:flex;justify-content:flex-end;}
.job-form-actions button{background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:8px 18px;font-size:11.5px;cursor:pointer;}
.job-form-actions button:hover{background:var(--accent);}

/* Worklog */
.day-group{margin-bottom:16px;}
.day-label{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;}
.wl-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chip{font-size:11.5px;padding:4px 11px;border-radius:14px;background:var(--paper);color:var(--ink-soft);cursor:pointer;border:1px solid transparent;}
.chip:hover{border-color:var(--line);}
.chip.active{background:#EAF0F7;color:var(--accent);font-weight:600;}
.capture-actions select{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:11.5px;background:var(--card);color:var(--ink);outline:none;}
.week-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px;}
.week-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.week-warn{display:flex;gap:6px;font-size:12px;color:var(--accent-warm);background:#FBF3EA;border-radius:7px;padding:8px 10px;margin-bottom:10px;line-height:1.5;}
.week-card textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:'Source Serif 4',serif;font-size:13px;color:var(--ink);background:var(--paper);resize:vertical;outline:none;}
.week-card textarea:focus{border-color:var(--accent);}
.todo-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;}
.todo-row input{accent-color:var(--accent);}
.todo-done{text-decoration:line-through;color:var(--ink-soft);}

/* 课堂速记：先选课程再写；暂存区放不确定归属的记录 */
.course-log{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(30,42,38,0.04);}
.course-log-head{font-size:13px;font-weight:600;margin-bottom:2px;}
.course-log-sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;}
.course-log textarea{width:100%;border:1px solid var(--line);border-radius:9px;font-family:'Source Serif 4',serif;font-size:14px;color:var(--ink);padding:10px;min-height:60px;line-height:1.5;outline:none;box-sizing:border-box;resize:vertical;}
.course-log textarea:focus{border-color:var(--accent);}
.course-log .img-thumbs{padding:0;margin-top:8px;}
.course-log-actions{display:flex;align-items:center;gap:6px;margin-top:8px;}
.stash-row{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.stash-text{font-size:12.5px;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stash-actions{display:flex;gap:6px;flex-shrink:0;}

/* Course capture: 页面内嵌的知识点录入卡片（替代原来的三步引导+二选一弹窗） */
.course-capture{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(30,42,38,0.05);transition:border-color .12s,background .12s;}
.course-capture.drag-over{border-color:var(--accent);background:#EAF0F7;}
.cc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cc-head-title{font-size:15px;font-weight:600;}
.cc-toggle{font-size:12px;color:var(--ink-soft);cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:5px 10px;background:transparent;}
.cc-toggle:hover{border-color:var(--accent);color:var(--accent);}
.cc-hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
.course-capture textarea, .course-capture input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;font-family:'Source Serif 4',serif;font-size:15px;color:var(--ink);padding:14px;line-height:1.6;outline:none;box-sizing:border-box;}
.course-capture textarea{min-height:160px;resize:vertical;}
.course-capture textarea:focus, .course-capture input[type=text]:focus{border-color:var(--accent);}
.cc-title-input{margin-bottom:10px;}
.cc-imgbar{display:flex;align-items:center;gap:10px;margin-top:10px;}
.cc-imgbar .ghost-btn{font-size:12.5px;padding:7px 14px;}
.cc-hintline{font-size:11.5px;color:var(--ink-soft);}
.course-capture .img-thumbs{margin-top:10px;padding:0;}
.course-capture .img-thumb{width:64px;height:64px;}
.cc-actions{display:flex;gap:12px;margin-top:18px;}
.cc-actions button{flex:1;padding:11px;border-radius:9px;font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);}
.cc-actions button:hover{border-color:var(--accent);}
.cc-actions button.pri{background:var(--ink);color:var(--paper);border:none;}
.cc-actions button.pri:hover{background:var(--accent);}
.cc-actions button:disabled{background:#B7BDB8;color:#fff;cursor:default;border:none;}
.cc-switch-row{text-align:right;margin-top:10px;}
.cc-switch-link{font-size:12.5px;color:var(--accent);cursor:pointer;}
.cc-collapsed-bar{border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center;font-size:13px;color:var(--ink-soft);cursor:pointer;margin-bottom:16px;}
.cc-collapsed-bar:hover{border-color:var(--accent);color:var(--accent);}

.course-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.course-card:hover{border-color:var(--accent);}
.course-card .cname{font-size:14.5px;font-weight:600;}
.course-card .ccount{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.course-card .cdel{font-size:11px;color:var(--ink-soft);flex-shrink:0;padding:2px 6px;border-radius:5px;}
.course-card .cdel:hover{color:#d33;background:#fdeaea;}

/* Courses */
.course-grid{display:flex;flex-direction:column;gap:10px;}
.step-block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.step-title{font-size:14px;font-weight:600;margin-bottom:6px;}
.step-content{font-size:12.5px;color:var(--ink-soft);line-height:1.6;white-space:pre-wrap;margin-bottom:8px;}
.step-block .ghost-btn{margin-right:8px;}
.step-img{max-width:220px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;}
.mindmap-btn{font-size:11.5px;border:1px solid var(--accent);color:var(--accent);border-radius:7px;padding:6px 12px;cursor:pointer;background:var(--card);margin-bottom:14px;}
.mindmap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;overflow-x:auto;}
.mm-root{font-family:'Fraunces',serif;font-weight:600;font-size:15px;background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;display:inline-block;margin-bottom:16px;}
.mm-branches{display:flex;gap:14px;flex-wrap:wrap;}
.mm-node{border:1.5px solid var(--accent-warm);border-radius:8px;padding:8px 12px;font-size:12px;max-width:170px;background:#FBF3EA;}

/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(20,26,24,0.45);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal{background:var(--card);border-radius:12px;padding:20px;width:360px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,0.2);max-height:88vh;overflow-y:auto;}
.modal.wide{width:600px;max-width:94vw;}
.modal.wide textarea{min-height:220px;}
.modal h3{font-family:'Fraunces',serif;font-size:16px;margin-bottom:12px;}
.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px;margin-bottom:10px;background:var(--paper);}
.modal textarea{min-height:70px;resize:vertical;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
.modal-actions button{font-size:12px;padding:7px 14px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:transparent;}
.modal-actions button.pri{background:var(--ink);color:var(--paper);border:none;}
.mstat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.mstat{background:var(--paper);border-radius:7px;padding:8px;text-align:center;}
.mstat b{display:block;font-size:16px;}
.mstat span{font-size:10px;color:var(--ink-soft);}
.opt-row{border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.5px;cursor:pointer;margin-bottom:6px;}
.opt-row:hover{border-color:var(--accent);}
.opt-row.sel{border-color:var(--accent);background:#EAF0F7;}

function isItemSelected(id){
  return ui.selectedItemIds.includes(id);
}
function toggleItemSelection(id){
  ui.selectedItemIds = isItemSelected(id)
    ? ui.selectedItemIds.filter(x=>x!==id)
    : [...ui.selectedItemIds, id];
}
function removeItems(ids, confirmText){
  if(!ids.length) return;
  if(!confirm(confirmText)) return;
  const idSet = new Set(ids);
  state.items = state.items.filter(item=>!idSet.has(item.id));
  ui.selectedItemIds = ui.selectedItemIds.filter(id=>!idSet.has(id));
  saveState();
  render();
}
function mountBulkToolbar(container, visibleItems){
  const visibleIds = visibleItems.map(item=>item.id);
  const selectedVisible = visibleIds.filter(isItemSelected);
  if(!ui.bulkMode){
    container.innerHTML = `<button class="bulk-btn" id="enterBulkBtn">批量管理</button>`;
    container.querySelector('#enterBulkBtn').onclick = ()=>{ ui.bulkMode=true; ui.selectedItemIds=[]; render(); };
    return;
  }
  container.innerHTML = `
    <span class="bulk-count">已选 ${selectedVisible.length} / ${visibleItems.length} 条</span>
    <button class="bulk-btn" id="selectVisibleBtn">${selectedVisible.length===visibleItems.length && visibleItems.length ? '取消全选' : '全选当前列表'}</button>
    <button class="bulk-btn danger" id="deleteSelectedBtn" ${selectedVisible.length?'':'disabled'}>删除已选</button>
    <button class="bulk-btn danger" id="deleteVisibleBtn" ${visibleItems.length?'':'disabled'}>清空当前列表</button>
    <button class="bulk-btn" id="exitBulkBtn">完成</button>`;
  container.querySelector('#selectVisibleBtn').onclick = ()=>{
    const allVisibleSelected = selectedVisible.length===visibleItems.length && visibleItems.length;
    ui.selectedItemIds = allVisibleSelected
      ? ui.selectedItemIds.filter(id=>!visibleIds.includes(id))
      : [...new Set([...ui.selectedItemIds, ...visibleIds])];
    render();
  };
  container.querySelector('#deleteSelectedBtn').onclick = ()=>{
    removeItems(selectedVisible, `确定删除已选的 ${selectedVisible.length} 条内容吗？此操作无法撤销。`);
  };
  container.querySelector('#deleteVisibleBtn').onclick = ()=>{
    removeItems(visibleIds, `确定清空当前列表中的 ${visibleItems.length} 条内容吗？此操作无法撤销。`);
  };
  container.querySelector('#exitBulkBtn').onclick = ()=>{ ui.bulkMode=false; ui.selectedItemIds=[]; render(); };
}

async function loadState(){
  let migrated = false;
  try{
    const savedState = await readStateFromIndexedDB();
    if(savedState){
      applySavedState(savedState);
    } else {
      // 兼容旧版本：首次升级时自动把 localStorage 数据迁移到 IndexedDB。
      const raw = localStorage.getItem('notes_app_data');
      if(raw){
        applySavedState(JSON.parse(raw));
        await writeStateToIndexedDB(state);
        migrated = true;
      }
    }
  }catch(e){
    // 少数浏览器禁用 IndexedDB 时，仍可读取旧版本地数据，避免用户数据不可见。
    try{
      const raw = localStorage.getItem('notes_app_data');
      if(raw) applySavedState(JSON.parse(raw));
    }catch(ignore){}
  }
  render();
  if(migrated) toast('旧版数据已迁移到更大容量的本地存储');
}
function applySavedState(d){
  state.folders = d.folders && d.folders.length ? d.folders : state.folders;
  state.items = d.items || [];
  state.jobs = d.jobs || [];
  state.courses = d.courses || [];
  state.courseSteps = d.courseSteps || [];
  state.courseStash = d.courseStash || [];
}

const DB_NAME = 'notes_assistant_db';
const DB_VERSION = 1;
const DB_STORE = 'app_state';
const DB_STATE_KEY = 'main';
let dbPromise = null;
let saveQueue = Promise.resolve();

function getDatabase(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = ()=>{
      const db = request.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    request.onsuccess = ()=>resolve(request.result);
    request.onerror = ()=>reject(request.error);
  });
  return dbPromise;
}
async function readStateFromIndexedDB(){
  const db = await getDatabase();
  return new Promise((resolve,reject)=>{
    const request = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(DB_STATE_KEY);
    request.onsuccess = ()=>resolve(request.result || null);
    request.onerror = ()=>reject(request.error);
  });
}
async function writeStateToIndexedDB(data){
  const db = await getDatabase();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(data, DB_STATE_KEY);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
    tx.onabort = ()=>reject(tx.error);
  });
}
function saveState(){
  // 保存快照并排队写入，避免连续操作时异步写入顺序错乱。
  const snapshot = JSON.parse(JSON.stringify(state));
  saveQueue = saveQueue.then(()=>writeStateToIndexedDB(snapshot)).catch(()=>{
    // IndexedDB 被浏览器隐私设置禁用时，退回旧存储方式，保证基本可用。
    try{
      localStorage.setItem('notes_app_data', JSON.stringify(snapshot));
      toast('IndexedDB 不可用，已临时使用浏览器基础存储；请定期导出备份');
    }catch(ignore){
      toast('保存失败，可能是浏览器存储空间已满或被禁用；请导出 JSON 备份后清理内容');
    }
  });
  return saveQueue;
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

/* ===================== 拖拽/粘贴图片通用绑定 ===================== */
function attachImageDrop(container, onFiles){
  let depth = 0;
  container.addEventListener('dragenter', e=>{
    if(!e.dataTransfer || ![...e.dataTransfer.items||[]].some(it=>it.kind==='file')) return;
    e.preventDefault(); depth++; container.classList.add('drag-over');
  });
  container.addEventListener('dragover', e=>{ e.preventDefault(); });
  container.addEventListener('dragleave', e=>{
    depth = Math.max(0, depth-1);
    if(depth===0) container.classList.remove('drag-over');
  });
  container.addEventListener('drop', e=>{
    e.preventDefault(); depth=0; container.classList.remove('drag-over');
    const files = [...(e.dataTransfer.files||[])].filter(f=>f.type.startsWith('image/'));
    if(files.length) onFiles(files);
  });
  // 顺带支持粘贴截图/图片
  container.addEventListener('paste', e=>{
    const files = [...(e.clipboardData?.items||[])].filter(it=>it.kind==='file' && it.type.startsWith('image/')).map(it=>it.getAsFile());
    if(files.length){ onFiles(files); }
  });
}

/* ===================== 图片压缩 ===================== */
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1000;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function navItem(viewKey,label,count,color,delId,showDel){
  const b = document.createElement('button');
  b.className='nav-item'+(ui.view===viewKey?' active':'');
  b.innerHTML = `<span class="nav-dot" style="background:${color}"></span><span class="nav-label"${delId?' title="双击重命名"':''}>${escapeHtml(label)}</span><span class="nav-count">${count}</span>${showDel?'<span class="nav-del">✕</span>':''}`;
  b.onclick=(e)=>{
    if(e.target.classList.contains('nav-del')){
      e.stopPropagation();
      if(confirm('删除该文件夹？内容会移入"未分类"')){
        state.items.forEach(i=>{ if(i.folderId===delId) i.folderId='__unfiled__'; });
        state.folders = state.folders.filter(f=>f.id!==delId);
        saveState(); render();
      }
      return;
    }
    ui.view = viewKey; render();
  };
  if(delId){
    b.querySelector('.nav-label').ondblclick=(e)=>{
      e.stopPropagation();
      ui.renamingFolderId = delId; render();
    };
  }
  return b;
}

function renameRow(f){
  const b = document.createElement('div');
  b.className='nav-item';
  b.innerHTML = `<span class="nav-dot" style="background:${colorFor(f.id)}"></span><input id="renameInput" value="${escapeAttr(f.name)}" style="flex:1;border:1px solid var(--accent);border-radius:5px;padding:2px 6px;font-size:13px;background:var(--card);color:var(--ink);outline:none;">`;
  const input = b.querySelector('#renameInput');
  let done = false;
  const commit = ()=>{
    if(done) return; done = true;
    const v = input.value.trim();
    if(v) f.name = v;
    ui.renamingFolderId = null;
    saveState(); render();
  };
  input.onkeydown=(e)=>{
    if(e.key==='Enter') commit();
    if(e.key==='Escape'){ done=true; ui.renamingFolderId=null; render(); }
  };
  input.onblur = commit;
  setTimeout(()=>{ input.focus(); input.select(); },0);
  return b;
}

  else if(ui.view==='worklog') inner.appendChild(renderWorklogView());
  else if(ui.view==='courses') inner.appendChild(renderCoursesView());
  else inner.appendChild(renderFolderView());

  return el;
}

/* ---------- 文件夹 / 全部 视图 ---------- */
function renderFolderView(){
  const isAll = ui.view==='all';
  const folderId = isAll?null:ui.view.split(':')[1];
  const folder = folderId ? (folderId==='__unfiled__'?{id:'__unfiled__',name:'未分类'}:state.folders.find(f=>f.id===folderId)) : null;
  const title = isAll?'全部':folder.name;

  let list = state.items.filter(i=>{
    if(!isAll){
      if(folderId==='__unfiled__') return !i.folderId || i.folderId==='__unfiled__';
      return i.folderId===folderId;
    }
    return true;
  });
  if(ui.search){
    const q = ui.search.toLowerCase();
    list = list.filter(i=> (i.title||'').toLowerCase().includes(q) || (i.rawText||'').toLowerCase().includes(q));
  }
  list = list.slice().sort((a,b)=> (b.updatedAt||b.timestamp) - (a.updatedAt||a.timestamp));

  const wrap = document.createElement('div');
  const folderOptsHtml = isAll ? ['__unfiled__'].concat(state.folders.map(f=>f.id)).map(fid=>{
    const fo = fid==='__unfiled__' ? {id:'__unfiled__',name:'未分类'} : state.folders.find(f=>f.id===fid);
    return `<option value="${fo.id}" ${ui.captureFolderId===fo.id?'selected':''}>${escapeHtml(fo.name)}</option>`;
  }).join('') : '';
  wrap.innerHTML = `
    <div class="view-head"><span class="view-title">${escapeHtml(title)}</span><span class="view-count">${list.length} 条</span></div>
    <div class="view-hint">${isAll?'选好文件夹再速记，随时能改':'速记与文档混排 · 按最近更新排序'}</div>
    <div class="capture" id="captureBox">
      <div class="capture-row">
        <textarea id="captureText" placeholder="${isAll?'随手记点什么...':'记到「'+escapeAttr(title)+'」里...'}"></textarea>
      </div>
      <div class="drop-hint">松开鼠标即可添加图片</div>
      <div class="img-thumbs" id="imgThumbs"></div>
      <div class="capture-actions">
        ${isAll?`<select id="captureFolder" style="max-width:140px;">${folderOptsHtml}</select>`:''}
        <label class="icon-btn" title="添加图片">📷<input type="file" id="imgInput" accept="image/*" multiple style="display:none"></label>
        <button class="primary" id="captureBtn">速记</button>
      </div>
    </div>
    <div class="newdoc-row"><span class="ghost-btn" id="newDocBtn">+ 新建文档</span></div>
    <div class="bulk-toolbar" id="bulkToolbar"></div>
    <div class="entries" id="entriesSlot"></div>
  `;

  const imgThumbs = wrap.querySelector('#imgThumbs');
  function renderThumbs(){
    imgThumbs.innerHTML='';
    ui.pendingImages.forEach((src,idx)=>{
      const d = document.createElement('div'); d.className='img-thumb';
      d.innerHTML = `<img src="${src}"><button class="rm">×</button>`;
      d.querySelector('.rm').onclick=()=>{ui.pendingImages.splice(idx,1); renderThumbs();};
      imgThumbs.appendChild(d);
    });
  }
  renderThumbs();
  wrap.querySelector('#imgInput').onchange = async (e)=>{
    for(const f of e.target.files){ const b64 = await compressImage(f); ui.pendingImages.push(b64); }
    renderThumbs();
  };
  attachImageDrop(wrap.querySelector('#captureBox'), async (files)=>{
    for(const f of files){ const b64 = await compressImage(f); ui.pendingImages.push(b64); }
    renderThumbs();
  });

  if(isAll){
    wrap.querySelector('#captureFolder').onchange = e=> ui.captureFolderId = e.target.value;
  }

  wrap.querySelector('#captureBtn').onclick = ()=>{
    const ta = wrap.querySelector('#captureText');
    const text = ta.value.trim();
    if(!text && ui.pendingImages.length===0) return;
    const targetFolder = isAll ? (ui.captureFolderId||'__unfiled__') : folderId;
    addItem('note', targetFolder||'__unfiled__', null, text, ui.pendingImages);
    ui.pendingImages = [];
    render();
  };

  wrap.querySelector('#newDocBtn').onclick = ()=>{
    ui.modal = { type:'newDoc', folderId: isAll? (ui.captureFolderId||state.folders[0]?.id||'__unfiled__') : folderId, title:'', body:'' };
    render();
  };

  mountBulkToolbar(wrap.querySelector('#bulkToolbar'), list);
  const entriesSlot = wrap.querySelector('#entriesSlot');
  if(list.length===0){
    entriesSlot.innerHTML = '<div class="empty">还没有内容，从上方开始记录吧</div>';
  } else {
    list.forEach(item=> entriesSlot.appendChild(renderEntry(item)));
  }
  return wrap;
}

function renderEntry(item){
  const f = state.folders.find(f=>f.id===item.folderId);
  const fname = item.folderId==='__unfiled__' || !item.folderId ? '未分类' : (f?f.name:'未分类');
  const color = colorFor(item.folderId);
  const d = new Date(item.updatedAt||item.timestamp);
  const timeStr = `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const div = document.createElement('div');
  div.className='entry';
  div.style.borderLeftColor = color;
  div.innerHTML = `
    <div class="entry-top">
      ${ui.bulkMode?`<input class="bulk-check" type="checkbox" aria-label="选择这条内容" ${isItemSelected(item.id)?'checked':''}>`:''}
      <span class="entry-time">${timeStr}</span>
      <span class="entry-tag" style="background:${color}">${item.type==='doc'?'文档':'速记'}</span>
      <span class="entry-folder">${escapeHtml(fname)}</span>
      ${ui.bulkMode?'':`<span class="entry-actions"><span data-act="edit">编辑</span><span data-act="del">删除</span></span>`}
    </div>
    ${item.title?`<div class="entry-title">${escapeHtml(item.title)}</div>`:''}
    <div class="entry-body">${escapeHtml(item.rawText||'')}</div>
    ${item.images&&item.images.length?`<div class="entry-imgs">${item.images.map(s=>`<img src="${s}">`).join('')}</div>`:''}
  `;
  if(ui.bulkMode){
    div.querySelector('.bulk-check').onchange=()=>{ toggleItemSelection(item.id); render(); };
  } else {
    div.querySelector('[data-act="del"]').onclick=()=>{
      removeItems([item.id], '删除这条内容？此操作无法撤销。');
    };
    div.querySelector('[data-act="edit"]').onclick=()=>{
      ui.modal = { type:'editItem', item };
      render();
    };
  }
  return div;
}

/* ---------- 工作日志回顾 ---------- */
function currentWeekRange(ts){
  const d = new Date(ts);
  const day = d.getDay();
  const diffToMon = (day===0?-6:1-day);
  const mon = new Date(d); mon.setDate(d.getDate()+diffToMon); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  const fmt = (x)=> `${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  return { start:mon, end:sun, label:`${fmt(mon)} ~ ${fmt(sun)}` };
}

function addWorklogItem(folderId, tag, text, todos, images, weekRange){
  state.items.push({ id:uid('i'), type:'note', folderId, title:null, rawText:text||'', tag:tag||null,
    todos: todos||null, weekRange: weekRange||null, images: images||[], timestamp:Date.now(), updatedAt:Date.now() });
  saveState();
}

function renderWorklogView(){
  const folder = state.folders.find(f=>f.isWorklog);
  let list = state.items.filter(i=>i.folderId===folder.id);
  if(ui.wlFilterTag && ui.wlFilterTag!=='全部'){ list = list.filter(i=>i.tag===ui.wlFilterTag); }
  list = list.slice().sort((a,b)=>(b.timestamp)-(a.timestamp));
  const groups = {};
  list.forEach(i=>{
    const d = new Date(i.timestamp);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    (groups[key] = groups[key]||[]).push(i);
  });

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="view-head"><span class="view-title">工作日志回顾</span><span class="view-count">${list.length} 条</span></div>
    <div class="view-hint">按时间线回看你写过的日志 · 与「工作日志」文件夹同源</div>
    <div class="wl-tags" id="wlTags"></div>
    <div id="wlComposeSlot"></div>
    <div class="bulk-toolbar" id="wlBulkToolbar"></div>
    <div id="wlGroups"></div>
  `;

  const isWeeklyMode = ui.wlFilterTag === '周报';

  // 标签筛选：点击标签栏同时决定下方输入区显示"速记表单"还是"周报编写区"，
  // 点普通标签时也把速记表单的标签同步过去，不用再去下拉菜单里重复选一次
  const tagsEl = wrap.querySelector('#wlTags');
  ['全部',...WORKLOG_TAGS].forEach(tg=>{
    const chip = document.createElement('span');
    chip.className='chip'+(ui.wlFilterTag===tg?' active':'');
    chip.textContent=tg;
    chip.onclick=()=>{
      ui.wlFilterTag = tg;
      if(tg!=='全部' && tg!=='周报') ui.wlTag = tg;
      render();
    };
    tagsEl.appendChild(chip);
  });

  const composeSlot = wrap.querySelector('#wlComposeSlot');

  if(isWeeklyMode){
    // 周报编写区（点顶部"周报"标签后直接切换到这里，不再单独隔离在列表下方）
    const wk = currentWeekRange(Date.now());
    const weekDailies = state.items.filter(i=>i.folderId===folder.id && i.tag==='日报' && i.timestamp>=wk.start.getTime() && i.timestamp<=wk.end.getTime());
    const weekCard = document.createElement('div');
    weekCard.className='week-card';
    weekCard.innerHTML = `
      <div class="week-head">
        <span class="entry-tag" style="background:var(--cat-worklog)">周报</span>
        <span class="entry-time">${wk.label}</span>
        <span class="entry-time" style="margin-left:auto;">本周已记 ${weekDailies.length} 条日报</span>
      </div>
      <textarea id="weekText" placeholder="在这里写本周的周报...">${escapeHtml(ui.weeklyDraft||'')}</textarea>
      <div class="job-form-actions" style="margin-top:8px;"><button id="weekSave">保存周报</button></div>
    `;
    composeSlot.appendChild(weekCard);
    weekCard.querySelector('#weekText').oninput = e=> ui.weeklyDraft = e.target.value;
    weekCard.querySelector('#weekSave').onclick = ()=>{
      if(!ui.weeklyDraft || !ui.weeklyDraft.trim()) return;
      addWorklogItem(folder.id, '周报', ui.weeklyDraft.trim(), null, [], wk.label);
      ui.weeklyDraft='';
      ui.wlFilterTag='全部';
      render();
    };
  } else {
    // 普通速记表单（会议纪要/待办/日报/全部）
    const captureEl = document.createElement('div');
    captureEl.className='capture'; captureEl.id='wlCapture';
    captureEl.innerHTML = `
      <div class="capture-row"><textarea id="wlText" placeholder="记今天做了什么，选个标签更好找..."></textarea></div>
      <div class="drop-hint">松开鼠标即可添加图片</div>
      <div class="img-thumbs" id="wlThumbs"></div>
      <div id="wlHint" style="font-size:11px;color:var(--ink-soft);padding:0 6px 4px;display:none;">选择"待办"标签时，每一行会变成一条可勾选的待办</div>
      <div class="capture-actions">
        <select id="wlTagSel"></select>
        <label class="icon-btn" title="添加图片">📷<input type="file" id="wlImgInput" accept="image/*" multiple style="display:none"></label>
        <button class="primary" id="wlBtn">速记</button>
      </div>
    `;
    composeSlot.appendChild(captureEl);

    // 标签选择 + 待办占位提示
    const tagSel = captureEl.querySelector('#wlTagSel');
    tagSel.innerHTML = WORKLOG_TAGS.filter(t=>t!=='周报').map(tg=>`<option value="${tg}" ${tg===ui.wlTag?'selected':''}>${tg}</option>`).join('');
    const wlText = captureEl.querySelector('#wlText');
    const wlHint = captureEl.querySelector('#wlHint');
    function syncTagUi(){
      wlHint.style.display = ui.wlTag==='待办' ? 'block' : 'none';
      wlText.placeholder = ui.wlTag==='待办' ? '一行一条待办，比如：\n发送会议邀请\n整理需求文档' : '记今天做了什么，选个标签更好找...';
    }
    tagSel.onchange = e=>{ ui.wlTag = e.target.value; syncTagUi(); };
    syncTagUi();

    // 图片上传
    const thumbs = captureEl.querySelector('#wlThumbs');
    function renderWlThumbs(){
      thumbs.innerHTML='';
      ui.wlPendingImages.forEach((src,idx)=>{
        const d=document.createElement('div'); d.className='img-thumb';
        d.innerHTML=`<img src="${src}"><button class="rm">×</button>`;
        d.querySelector('.rm').onclick=()=>{ ui.wlPendingImages.splice(idx,1); renderWlThumbs(); };
        thumbs.appendChild(d);
      });
    }
    renderWlThumbs();
    captureEl.querySelector('#wlImgInput').onchange = async (e)=>{
      for(const f of e.target.files){ ui.wlPendingImages.push(await compressImage(f)); }
      renderWlThumbs();
    };
    attachImageDrop(captureEl, async (files)=>{
      for(const f of files){ ui.wlPendingImages.push(await compressImage(f)); }
      renderWlThumbs();
    });

    captureEl.querySelector('#wlBtn').onclick=()=>{
      const text = wlText.value.trim();
      if(!text && ui.wlPendingImages.length===0) return;
      if(ui.wlTag==='待办'){
        const todos = text.split('\n').map(t=>t.trim()).filter(Boolean).map(t=>({text:t, done:false}));
        addWorklogItem(folder.id, '待办', '', todos, ui.wlPendingImages);
      } else {
        addWorklogItem(folder.id, ui.wlTag, text, null, ui.wlPendingImages);
      }
      ui.wlPendingImages=[];
      render();
    };
  }

  mountBulkToolbar(wrap.querySelector('#wlBulkToolbar'), list);
  const gEl = wrap.querySelector('#wlGroups');
  const keys = Object.keys(groups).sort().reverse();
  if(keys.length===0){ gEl.innerHTML='<div class="empty">工作日志还是空的，写下今天做了什么吧</div>'; }
  keys.forEach(k=>{
    const g = document.createElement('div'); g.className='day-group';
    const d = new Date(k);
    const weekday = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    g.innerHTML = `<div class="day-label">${k.slice(5).replace('-','月')}日 · ${weekday}</div>`;
    const listWrap = document.createElement('div'); listWrap.style.display='flex'; listWrap.style.flexDirection='column'; listWrap.style.gap='8px';
    groups[k].forEach(item=> listWrap.appendChild(renderWlEntry(item)));
    g.appendChild(listWrap);
    gEl.appendChild(g);
  });
  return wrap;
}

function renderWlEntry(item){
  const color = 'var(--cat-worklog)';
  const d = new Date(item.updatedAt||item.timestamp);
  const timeStr = `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const div = document.createElement('div'); div.className='entry'; div.style.padding='10px 14px'; div.style.borderLeftColor=color;
  let bodyHtml;
  if(item.tag==='待办' && item.todos && item.todos.length){
    bodyHtml = item.todos.map((td,idx)=>`<div class="todo-row"><input type="checkbox" data-idx="${idx}" ${td.done?'checked':''}><span class="${td.done?'todo-done':''}">${escapeHtml(td.text)}</span></div>`).join('');
  } else {
    bodyHtml = `<div class="entry-body">${escapeHtml(item.rawText||'')}</div>`;
  }
  div.innerHTML = `
    <div class="entry-top">
      ${ui.bulkMode?`<input class="bulk-check" type="checkbox" aria-label="选择这条日志" ${isItemSelected(item.id)?'checked':''}>`:''}
      <span class="entry-time">${timeStr}</span>
      ${item.tag?`<span class="entry-tag" style="background:${color}">${escapeHtml(item.tag)}</span>`:''}
      ${item.weekRange?`<span class="entry-folder">${escapeHtml(item.weekRange)}</span>`:''}
      ${ui.bulkMode?'':`<span class="entry-actions"><span data-act="edit">编辑</span><span data-act="del">删除</span></span>`}
    </div>
    ${bodyHtml}
    ${item.images&&item.images.length?`<div class="entry-imgs">${item.images.map(s=>`<img src="${s}">`).join('')}</div>`:''}
  `;
  if(ui.bulkMode){
    div.querySelector('.bulk-check').onchange=()=>{ toggleItemSelection(item.id); render(); };
  } else {
    div.querySelector('[data-act="del"]').onclick=()=>{
      removeItems([item.id], '删除这条内容？此操作无法撤销。');
    };
    div.querySelector('[data-act="edit"]').onclick=()=>{
      ui.modal = { type:'editWlItem', item };
      render();
    };
  }
  if(!ui.bulkMode && item.tag==='待办' && item.todos){
    div.querySelectorAll('.todo-row input[type=checkbox]').forEach(cb=>{
      cb.onchange = ()=>{ item.todos[+cb.dataset.idx].done = cb.checked; saveState(); render(); };
    });
  }
  return div;
}

      ui.courseDetail = c.id; resetCourseCapture(c.id); render();

    card.querySelector('[data-del]').onclick=(e)=>{
      e.stopPropagation();

        state.courses = state.courses.filter(x=>x.id!==c.id);
        state.courseSteps = state.courseSteps.filter(s=>s.courseId!==c.id);
        saveState(); render();

  box.querySelector('#clImg').onchange = async (e)=>{ for(const f of e.target.files){ ui.clImages.push(await compressImage(f)); } renderThumbs(); };
  attachImageDrop(box, async (files)=>{ for(const f of files){ ui.clImages.push(await compressImage(f)); } renderThumbs(); });

  box.querySelector('#clBtn').onclick = ()=>{
    const text = ui.clText.trim();
    if(!text && ui.clImages.length===0) return;
    const images = ui.clImages.slice();
    if(ui.clCourseId && state.courses.some(c=>c.id===ui.clCourseId)){

      state.courseStash.push({id:uid('cs'), text, images, createdAt:Date.now()});

    saveState();
    ui.clText=''; ui.clImages=[];
    render();
  };

  slot.appendChild(box);
}

    `;
    row.querySelector('[data-move]').onclick=()=>{
      ui.modal={type:'pickCourse', text:item.text, images:item.images, stashId:item.id};
      render();
    };
    row.querySelector('[data-del]').onclick=()=>{
      if(confirm('删除这条暂存内容？')){
        state.courseStash = state.courseStash.filter(x=>x.id!==item.id);
        saveState(); render();
      }
    };
    wrap.appendChild(row);
  });
  slot.appendChild(wrap);
}

function renderCourseDetail(courseId){
  const course = state.courses.find(c=>c.id===courseId);
  const steps = state.courseSteps.filter(s=>s.courseId===courseId).sort((a,b)=>a.order-b.order);
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="view-head"><span class="ghost-btn" id="backBtn" style="margin-right:8px">← 返回</span><span class="view-title">${escapeHtml(course.name)}</span><span class="view-count">${steps.length} 个知识点</span></div>
    <div class="view-hint">记录知识点，可配图</div>
    <button class="mindmap-btn" id="genMindmap">生成思维导图</button>
    <div id="mindmapSlot"></div>
    <div id="ccSlot"></div>
    <div id="stepList"></div>
  `;
  wrap.querySelector('#backBtn').onclick=()=>{ ui.courseDetail=null; render(); };
  wrap.querySelector('#genMindmap').onclick=()=>{
    const slot = wrap.querySelector('#mindmapSlot');
    slot.innerHTML = '';
    const mm = document.createElement('div'); mm.className='mindmap';
    mm.innerHTML = `<div class="mm-root">${escapeHtml(course.name)}</div><div class="mm-branches">${steps.map(s=>`<div class="mm-node"><b>${escapeHtml(s.title)}</b></div>`).join('')}</div>`;
    slot.appendChild(mm);
  };

  renderCourseCapture(wrap.querySelector('#ccSlot'), courseId);

  const listEl = wrap.querySelector('#stepList');
  if(steps.length===0){
    listEl.innerHTML = '<div class="empty">还没有知识点，在上面写点什么开始吧</div>';
  }
  steps.forEach(s=>{
    const b = document.createElement('div'); b.className='step-block';
    const imgsHtml = (s.images && s.images.length)
      ? `<div class="entry-imgs">${s.images.map(x=>`<img class="step-img" src="${x}">`).join('')}</div>`
      : (s.image ? `<img class="step-img" src="${s.image}">` : '');
    b.innerHTML = `
      <div class="step-title">${escapeHtml(s.title)}</div>
      ${imgsHtml}
      <div class="step-content">${escapeHtml(s.content||'')}</div>
      <span class="ghost-btn" data-edit>编辑</span>
      <span class="ghost-btn" data-del>删除</span>
    `;
    b.querySelector('[data-edit]').onclick=()=>{
      ui.modal = { type:'editCourseStep', step:s };
      render();
    };
    b.querySelector('[data-del]').onclick=()=>{
      state.courseSteps = state.courseSteps.filter(x=>x.id!==s.id); saveState(); render();
    };
    listEl.appendChild(b);
  });
  return wrap;
}

/* 课程详情页顶部的内嵌录入卡片：默认就是可以直接写字/贴图的"快速录入"，
   不再先弹二选一小窗；想按知识点细写的，用卡片内的次要链接切换 */
function renderCourseCapture(slot, courseId){
  if(!ui.ccOpen){
    const bar = document.createElement('div');
    bar.className='cc-collapsed-bar';
    bar.textContent='+ 记录新内容';
    bar.onclick=()=>{ ui.ccOpen=true; render(); };
    slot.appendChild(bar);
    return;
  }

  const card = document.createElement('div');
  card.className='course-capture';

  if(ui.ccMode==='quick'){
    card.innerHTML = `
      <div class="cc-head"><span class="cc-head-title">快速记录这节课</span><span class="cc-toggle" id="ccCollapse">收起</span></div>
      <div class="cc-hint">把这节课的笔记、板书、老师说的重点粘贴/写在这里，不用管格式</div>
      <textarea id="ccText" placeholder="开始输入...">${escapeHtml(ui.ccText||'')}</textarea>
      <div class="cc-imgbar">
        <label class="ghost-btn" style="display:inline-flex;align-items:center;gap:6px;">📷 添加图片<input type="file" id="ccImg" accept="image/*" multiple style="display:none"></label>
        <span class="cc-hintline">支持拖拽/粘贴多张截图</span>
      </div>
      <div class="img-thumbs" id="ccThumbs"></div>
      <div class="cc-actions">
        <button class="pri" id="ccSaveWhole">直接保存这条</button>
      </div>
      <div class="cc-switch-row"><span class="cc-switch-link" id="ccToStep">想按知识点一条条细写？</span></div>
    `;
    const textEl = card.querySelector('#ccText');
    textEl.oninput = e=> ui.ccText = e.target.value;
    const thumbs = card.querySelector('#ccThumbs');
    function renderThumbs(){
      thumbs.innerHTML='';
      ui.ccImages.forEach((src,idx)=>{
        const d=document.createElement('div'); d.className='img-thumb';
        d.innerHTML=`<img src="${src}"><button class="rm">×</button>`;
        d.querySelector('.rm').onclick=()=>{ ui.ccImages.splice(idx,1); renderThumbs(); };
        thumbs.appendChild(d);
      });
    }
    renderThumbs();
    card.querySelector('#ccImg').onchange = async (e)=>{ for(const f of e.target.files){ ui.ccImages.push(await compressImage(f)); } renderThumbs(); };
    attachImageDrop(card, async (files)=>{ for(const f of files){ ui.ccImages.push(await compressImage(f)); } renderThumbs(); });

    card.querySelector('#ccCollapse').onclick=()=>{ ui.ccOpen=false; render(); };
    card.querySelector('#ccToStep').onclick=()=>{ ui.ccMode='step'; render(); };

    card.querySelector('#ccSaveWhole').onclick=()=>{
      const text = ui.ccText.trim();
      if(!text && ui.ccImages.length===0) return;
      const order = state.courseSteps.filter(s=>s.courseId===courseId).length;
      state.courseSteps.push({id:uid('st'), courseId, title:'整体笔记 · '+new Date().toLocaleDateString('zh-CN'), content:text, image:ui.ccImages[0]||null, images:ui.ccImages, order, createdAt:Date.now()});
      saveState();
      ui.ccText=''; ui.ccImages=[];
      render();
    };
  } else {
    // 分步骤细写模式
    card.innerHTML = `
      <div class="cc-head"><span class="cc-head-title">新增知识点</span><span class="cc-toggle" id="ccCollapse">收起</span></div>
      <input type="text" id="ccTitle" class="cc-title-input" placeholder="知识点标题，如 蒙版转场怎么做" value="${escapeAttr(ui.ccTitle||'')}">
      <textarea id="ccContent" placeholder="操作说明...">${escapeHtml(ui.ccContent||'')}</textarea>
      <div class="cc-imgbar">
        <label class="ghost-btn" style="display:inline-flex;align-items:center;gap:6px;">📷 添加图片<input type="file" id="ccStepImg" accept="image/*" style="display:none"></label>
        <span class="cc-hintline">也可以直接拖拽图片到这里，或粘贴截图</span>
      </div>
      <div id="ccStepImgPreview" style="margin-top:8px">${ui.ccStepImage?`<img src="${ui.ccStepImage}" style="width:80px;border-radius:6px;">`:''}</div>
      <div class="cc-actions"><button class="pri" id="ccSaveStep">保存知识点</button></div>
      <div class="cc-switch-row"><span class="cc-switch-link" id="ccToQuick">返回快速录入</span></div>
    `;
    card.querySelector('#ccTitle').oninput = e=> ui.ccTitle = e.target.value;
    card.querySelector('#ccContent').oninput = e=> ui.ccContent = e.target.value;
    const setImg = async (file)=>{ ui.ccStepImage = await compressImage(file); card.querySelector('#ccStepImgPreview').innerHTML = `<img src="${ui.ccStepImage}" style="width:80px;border-radius:6px;">`; };
    card.querySelector('#ccStepImg').onchange = async (e)=>{ if(e.target.files[0]) await setImg(e.target.files[0]); };
    attachImageDrop(card, async (files)=>{ if(files[0]) await setImg(files[0]); });

    card.querySelector('#ccCollapse').onclick=()=>{ ui.ccOpen=false; render(); };
    card.querySelector('#ccToQuick').onclick=()=>{ ui.ccMode='quick'; render(); };
    card.querySelector('#ccSaveStep').onclick=()=>{
      const title = ui.ccTitle.trim();
      if(!title) return;
      const order = state.courseSteps.filter(s=>s.courseId===courseId).length;
      state.courseSteps.push({id:uid('st'), courseId, title, content:ui.ccContent.trim(), image:ui.ccStepImage, order, createdAt:Date.now()});
      saveState();
      ui.ccTitle=''; ui.ccContent=''; ui.ccStepImage=null;
      render();
    };
  }

  slot.appendChild(card);
}

/* ===================== 弹窗 ===================== */
function renderModal(){
  const mask = document.createElement('div');
  mask.className='modal-mask';
  mask.onclick=(e)=>{ if(e.target===mask){ ui.modal=null; render(); } };
  const m = document.createElement('div'); m.className='modal';
  const wideTypes = ['editItem','editWlItem','newDoc','editCourseStep'];
  if(wideTypes.includes(ui.modal.type)) m.classList.add('wide');
  mask.appendChild(m);
  const t = ui.modal.type;

  if(t==='newFolder'){
    m.innerHTML = `<h3>新建文件夹</h3><input id="mfName" placeholder="文件夹名称"><div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">创建</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const name = m.querySelector('#mfName').value.trim();
      if(!name) return;
      state.folders.push({id:uid('f'), name, builtin:false});
      saveState(); closeModal();
    };
  }
  else if(t==='newDoc'){
    const folderOpts = state.folders.map(f=>`<option value="${f.id}" ${f.id===ui.modal.folderId?'selected':''}>${escapeHtml(f.name)}</option>`).join('');
    m.innerHTML = `<h3>新建文档</h3>
      <select id="mfFolder">${folderOpts}</select>
      <input id="mfTitle" placeholder="标题">
      <textarea id="mfBody" placeholder="正文内容..." style="min-height:140px"></textarea>
      <div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">保存</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const title = m.querySelector('#mfTitle').value.trim();
      const body = m.querySelector('#mfBody').value.trim();
      if(!title && !body) return closeModal();
      addItem('doc', m.querySelector('#mfFolder').value, title, body, []);
      closeModal();
    };
  }
  else if(t==='editItem'){
    const item = ui.modal.item;
    const folderOpts = [{id:'__unfiled__',name:'未分类'}].concat(state.folders).map(f=>`<option value="${f.id}" ${f.id===(item.folderId||'__unfiled__')?'selected':''}>${escapeHtml(f.name)}</option>`).join('');
    const d = new Date(item.updatedAt||item.timestamp);
    const dateVal = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const timeVal = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    m.innerHTML = `<h3>编辑</h3>
      <label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">所属文件夹</label>
      <select id="mfFolder">${folderOpts}</select>
      <input id="mfTitle" placeholder="标题（可选）" value="${escapeAttr(item.title||'')}">
      <textarea id="mfBody" style="min-height:140px">${escapeHtml(item.rawText||'')}</textarea>
      ${item.images&&item.images.length?`<div class="img-thumbs" style="margin-bottom:10px">${item.images.map(s=>`<div class="img-thumb"><img src="${s}"></div>`).join('')}</div>`:''}
      <label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">记录时间</label>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input type="date" id="mfDate" value="${dateVal}" style="flex:1;">
        <input type="time" id="mfTime" value="${timeVal}" style="flex:1;">
      </div>
      <div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">保存</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      item.folderId = m.querySelector('#mfFolder').value;
      item.title = m.querySelector('#mfTitle').value.trim();
      item.rawText = m.querySelector('#mfBody').value.trim();
      const dv = m.querySelector('#mfDate').value;
      const tv = m.querySelector('#mfTime').value || '00:00';
      const combined = dv ? new Date(`${dv}T${tv}`).getTime() : Date.now();
      item.updatedAt = isNaN(combined) ? Date.now() : combined;
      saveState(); closeModal();
    };
  }
  else if(t==='editWlItem'){
    const item = ui.modal.item;
    const d = new Date(item.updatedAt||item.timestamp);
    const dateVal = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const timeVal = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const isTodo = item.tag==='待办' && item.todos;
    const bodyField = isTodo
      ? `<label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">待办事项（每行一条）</label>
         <textarea id="mfBody" style="min-height:120px">${escapeHtml(item.todos.map(t=>t.text).join('\n'))}</textarea>`
      : `<textarea id="mfBody" style="min-height:120px">${escapeHtml(item.rawText||'')}</textarea>`;
    m.innerHTML = `<h3>编辑${item.tag?'·'+escapeHtml(item.tag):''}</h3>
      ${bodyField}
      ${item.images&&item.images.length?`<div class="img-thumbs" style="margin-bottom:10px">${item.images.map(s=>`<div class="img-thumb"><img src="${s}"></div>`).join('')}</div>`:''}
      <label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">记录时间</label>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input type="date" id="mfDate" value="${dateVal}" style="flex:1;">
        <input type="time" id="mfTime" value="${timeVal}" style="flex:1;">
      </div>
      <div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">保存</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const bodyVal = m.querySelector('#mfBody').value;
      if(isTodo){
        const lines = bodyVal.split('\n').map(s=>s.trim()).filter(Boolean);
        item.todos = lines.map((text,idx)=>({ text, done: (item.todos[idx]&&item.todos[idx].text===text) ? item.todos[idx].done : false }));
      } else {
        item.rawText = bodyVal.trim();
      }
      const dv = m.querySelector('#mfDate').value;
      const tv = m.querySelector('#mfTime').value || '00:00';
      const combined = dv ? new Date(`${dv}T${tv}`).getTime() : Date.now();
      item.updatedAt = isNaN(combined) ? Date.now() : combined;
      saveState(); closeModal();
    };
  }
  else if(t==='editCourseStep'){
    const step = ui.modal.step;
    const d = new Date(step.createdAt||Date.now());
    const dateVal = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const timeVal = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const imgs = (step.images&&step.images.length)?step.images:(step.image?[step.image]:[]);
    m.innerHTML = `<h3>编辑知识点</h3>
      <label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">标题</label>
      <input id="mfTitle" placeholder="知识点标题" value="${escapeAttr(step.title||'')}">
      <label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">内容</label>
      <textarea id="mfBody">${escapeHtml(step.content||'')}</textarea>
      ${imgs.length?`<div class="img-thumbs" style="margin-bottom:10px">${imgs.map(s=>`<div class="img-thumb"><img src="${s}"></div>`).join('')}</div>`:''}
      <label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">记录时间</label>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input type="date" id="mfDate" value="${dateVal}" style="flex:1;">
        <input type="time" id="mfTime" value="${timeVal}" style="flex:1;">
      </div>
      <div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">保存</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      step.title = m.querySelector('#mfTitle').value.trim() || step.title;
      step.content = m.querySelector('#mfBody').value.trim();
      const dv = m.querySelector('#mfDate').value;
      const tv = m.querySelector('#mfTime').value || '00:00';
      const combined = dv ? new Date(`${dv}T${tv}`).getTime() : step.createdAt;
      step.createdAt = isNaN(combined) ? step.createdAt : combined;
      saveState(); closeModal();
    };
  }
  else if(t==='newJob'){
    m.innerHTML = `<h3>新增求职意向</h3>
      <input id="mCo" placeholder="公司名称">
      <input id="mRole" placeholder="岗位名称">
      <textarea id="mNotes" placeholder="备注（可选）"></textarea>
      <div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">添加</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const co = m.querySelector('#mCo').value.trim();
      if(!co) return;
      state.jobs.push({id:uid('j'), company:co, position:m.querySelector('#mRole').value.trim(), stage:'待投递', notes:m.querySelector('#mNotes').value.trim(), createdAt:Date.now(), updatedAt:Date.now()});
      saveState(); closeModal();
    };
  }
  else if(t==='editJob'){
    const job = ui.modal.job;
    const stageOpts = STAGES.map(s=>`<option value="${s.key}" ${s.key===job.stage?'selected':''}>${s.key}</option>`).join('');
    m.innerHTML = `<h3>${escapeHtml(job.company)}</h3>
      <input id="mRole" value="${escapeAttr(job.position||'')}" placeholder="岗位名称">
      <input id="mTag" value="${escapeAttr(job.tag||'')}" placeholder="标签（可选）">
      <select id="mStage">${stageOpts}</select>
      <input id="mLink" value="${escapeAttr(job.jdLink||'')}" placeholder="岗位链接（可选）">
      <textarea id="mNotes" placeholder="备注">${escapeHtml(job.notes||'')}</textarea>
      <div class="modal-actions"><button id="mDel" style="color:var(--danger)">删除</button><button id="mCancel">取消</button><button class="pri" id="mOk">保存</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mDel').onclick=()=>{ state.jobs=state.jobs.filter(j=>j.id!==job.id); saveState(); closeModal(); };
    m.querySelector('#mOk').onclick=()=>{
      job.position = m.querySelector('#mRole').value.trim();
      job.tag = m.querySelector('#mTag').value.trim();
      job.stage = m.querySelector('#mStage').value;
      job.jdLink = m.querySelector('#mLink').value.trim();
      job.notes = m.querySelector('#mNotes').value.trim();
      job.updatedAt = Date.now();
      saveState(); closeModal();
    };
  }
  else if(t==='newCourse'){
    m.innerHTML = `<h3>新建课程</h3><input id="mName" placeholder="课程名称，如 Premiere剪辑"><div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">创建</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const name = m.querySelector('#mName').value.trim();
      if(!name) return;
      const c = {id:uid('c'), name, createdAt:Date.now()};
      state.courses.push(c); saveState(); ui.courseDetail=c.id; resetCourseCapture(c.id); closeModal();
    };
  }
  else if(t==='pickCourse'){
    m.innerHTML = `<h3>选择课程</h3><div id="pcList"></div><div class="modal-actions"><button id="mCancel">取消</button></div>`;
    const list = m.querySelector('#pcList');
    if(state.courses.length===0){ list.innerHTML='<div class="empty" style="padding:14px 0;">还没有课程，先创建一门吧</div>'; }
    state.courses.forEach(c=>{
      const row = document.createElement('div'); row.className='opt-row'; row.textContent=c.name;
      row.onclick=()=>{
        const order = state.courseSteps.filter(x=>x.courseId===c.id).length;
        state.courseSteps.push({id:uid('st'), courseId:c.id, title:'课堂速记 · '+new Date().toLocaleDateString('zh-CN'), content:ui.modal.text, image:(ui.modal.images||[])[0]||null, images:ui.modal.images||[], order, createdAt:Date.now()});
        if(ui.modal.stashId){ state.courseStash = state.courseStash.filter(x=>x.id!==ui.modal.stashId); }
        saveState(); closeModal();
      };
      list.appendChild(row);
    });
    m.querySelector('#mCancel').onclick=closeModal;
  }
  else if(t==='exportScope'){
    const scopes = [
      {key:'folder', label:'单个文件夹（含图）'},
      {key:'worklog', label:'工作日志（近30天，按天分组）'},
      {key:'jobs', label:'求职追踪（状态汇总表）'},
      {key:'all', label:'全部内容'},
    ];
    m.innerHTML = `<h3>导出为 ${ui.modal.format==='pdf'?'PDF':'Word'}</h3><div id="scList"></div><div id="folderSubSel"></div><div class="modal-actions"><button id="mCancel">取消</button><button class="pri" id="mOk">生成</button></div>`;
    const list = m.querySelector('#scList');
    let selected = 'all';
    let selFolder = state.folders[0]?.id;
    scopes.forEach(s=>{
      const row = document.createElement('div'); row.className='opt-row'+(s.key===selected?' sel':''); row.textContent=s.label;
      row.onclick=()=>{ selected=s.key; list.querySelectorAll('.opt-row').forEach(r=>r.classList.remove('sel')); row.classList.add('sel');
        m.querySelector('#folderSubSel').innerHTML = s.key==='folder' ? `<select id="subFolder">${state.folders.map(f=>`<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('')}</select>` : '';
      };
      list.appendChild(row);
    });
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#mOk').onclick=()=>{
      const fSel = m.querySelector('#subFolder');
      const folderId = fSel ? fSel.value : null;
      if(ui.modal.format==='pdf') exportPDF(selected, folderId); else exportWord(selected, folderId);
      closeModal();
    };
  }
  return mask;
}
function closeModal(){ ui.modal=null; render(); }

/* ===================== 导出 / 导入 ===================== */
function exportBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    version: 3,
    folders: state.folders,
    items: state.items,
    jobs: state.jobs,
    courses: state.courses,
    courseSteps: state.courseSteps,
    courseStash: state.courseStash,
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url; a.download = `记事助手备份_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('备份已下载');
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      ui.modal = { type:'importConfirm', data };
      render();
    }catch(err){ toast('文件格式不正确'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* 扩展导入确认弹窗 */
const _origRenderModal = renderModal;
renderModal = function(){
  if(ui.modal && ui.modal.type==='importConfirm'){
    const mask = document.createElement('div'); mask.className='modal-mask';
    const m = document.createElement('div'); m.className='modal'; mask.appendChild(m);
    const d = ui.modal.data;
    m.innerHTML = `<h3>导入备份</h3>
      <div class="mstat-grid">
        <div class="mstat"><b>${(d.folders||[]).length}</b><span>文件夹</span></div>
        <div class="mstat"><b>${(d.items||[]).length + (d.courseSteps||[]).length}</b><span>速记/文档</span></div>
        <div class="mstat"><b>${(d.jobs||[]).length}</b><span>求职记录</span></div>
      </div>
      <div class="opt-row" id="optMerge">合并（推荐）— 按内容 id 去重，只补齐缺失的</div>
      <div class="opt-row" id="optReplace">完全替换 — 用备份覆盖当前所有内容</div>
      <div class="modal-actions"><button id="mCancel">取消</button></div>`;
    m.querySelector('#mCancel').onclick=closeModal;
    m.querySelector('#optMerge').onclick=()=>{
      mergeBy(state.folders, d.folders); mergeBy(state.items, d.items); mergeBy(state.jobs, d.jobs);
      mergeBy(state.courses, d.courses); mergeBy(state.courseSteps, d.courseSteps); mergeBy(state.courseStash, d.courseStash);
      saveState(); toast('已合并导入'); closeModal();
    };
    m.querySelector('#optReplace').onclick=()=>{
      state.folders = d.folders||state.folders; state.items = d.items||[]; state.jobs = d.jobs||[];
      state.courses = d.courses||[]; state.courseSteps = d.courseSteps||[]; state.courseStash = d.courseStash||[];
      saveState(); toast('已替换为备份内容'); closeModal();
    };
    return mask;
  }
  return _origRenderModal();
};
function mergeBy(target, incoming){
  if(!incoming) return;
  const ids = new Set(target.map(x=>x.id));
  incoming.forEach(x=>{ if(!ids.has(x.id)) target.push(x); });
}

/* ===================== PDF / Word 导出 ===================== */
function buildExportHTML(scope, folderId){
  let title = '记事助手导出';
  let body = '';
  const dateStr = new Date().toLocaleString('zh-CN');

  function itemBlock(i){
    const f = state.folders.find(f=>f.id===i.folderId);
    return `<div style="margin-bottom:18px;"><div style="font-family:Georgia,serif;font-size:16px;font-weight:600;margin-bottom:4px;">${escapeHtml(i.title||'(速记)')}</div>
      <div style="font-size:11px;color:#888;margin-bottom:6px;">${new Date(i.updatedAt||i.timestamp).toLocaleString('zh-CN')} ${f?'· '+escapeHtml(f.name):''}</div>
      ${(i.images||[]).map(s=>`<img src="${s}" style="max-width:320px;display:block;margin-bottom:6px;border:1px solid #ddd;">`).join('')}
      <div style="font-size:13px;color:#333;line-height:1.7;white-space:pre-wrap;">${escapeHtml(i.rawText||'')}</div></div>`;
  }

  if(scope==='folder'){
    const f = state.folders.find(x=>x.id===folderId);
    title = f.name;
    const items = state.items.filter(i=>i.folderId===folderId).sort((a,b)=>b.timestamp-a.timestamp);
    body = items.map(itemBlock).join('');
  } else if(scope==='worklog'){
    title = '工作日志';
    const f = state.folders.find(x=>x.isWorklog);
    const cutoff = Date.now() - 30*24*3600*1000;
    const items = state.items.filter(i=>i.folderId===f.id && i.timestamp>=cutoff).sort((a,b)=>b.timestamp-a.timestamp);
    const groups={};
    items.forEach(i=>{ const dd=new Date(i.timestamp); const k=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`; (groups[k]=groups[k]||[]).push(i); });
    body = Object.keys(groups).sort().reverse().map(k=>`<h3 style="font-size:14px;margin:14px 0 6px;">${k}</h3>` + groups[k].map(i=>`<div style="font-size:13px;margin-bottom:6px;">${escapeHtml(i.rawText||'')}</div>`).join('')).join('');
  } else if(scope==='jobs'){
    title = '求职追踪状态汇总';
    body = `<table style="width:100%;border-collapse:collapse;font-size:12.5px;">
      <tr style="background:#f0f0f0;"><th style="border:1px solid #ccc;padding:6px;text-align:left;">公司</th><th style="border:1px solid #ccc;padding:6px;text-align:left;">岗位</th><th style="border:1px solid #ccc;padding:6px;text-align:left;">状态</th><th style="border:1px solid #ccc;padding:6px;text-align:left;">备注</th></tr>
      ${state.jobs.map(j=>`<tr><td style="border:1px solid #ccc;padding:6px;">${escapeHtml(j.company)}</td><td style="border:1px solid #ccc;padding:6px;">${escapeHtml(j.position||'')}</td><td style="border:1px solid #ccc;padding:6px;">${escapeHtml(j.stage)}</td><td style="border:1px solid #ccc;padding:6px;">${escapeHtml(j.notes||'')}</td></tr>`).join('')}
    </table>`;
  } else {
    title = '全部内容';
    body = state.folders.map(f=>{
      const items = state.items.filter(i=>i.folderId===f.id).sort((a,b)=>b.timestamp-a.timestamp);
      if(items.length===0) return '';
      return `<h2 style="font-family:Georgia,serif;font-size:18px;border-bottom:1px solid #ccc;padding-bottom:4px;margin:20px 0 10px;">${escapeHtml(f.name)}</h2>` + items.map(itemBlock).join('');
    }).join('');
  }
  return `<html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title></head>
    <body style="font-family:Georgia,'Source Serif 4',serif;color:#1a1a1a;max-width:760px;margin:30px auto;">
      <h1 style="font-size:22px;">${escapeHtml(title)}</h1>
      <div style="font-size:11px;color:#888;margin-bottom:20px;">导出于 ${dateStr}</div>
      ${body || '<div style="color:#999;">暂无内容</div>'}
    </body></html>`;
}

function exportPDF(scope, folderId){
  const html = buildExportHTML(scope, folderId);
  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  setTimeout(()=>win.print(), 400);
}

function exportWord(scope, folderId){
  const html = buildExportHTML(scope, folderId);
  const wrapped = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>${html.slice(html.indexOf('<head'))}`;
  const blob = new Blob(['\ufeff', wrapped], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '记事助手导出.doc';
  a.click(); URL.revokeObjectURL(url);
  toast('Word 文档已下载');
}

/* ===================== 图片灯箱（点击放大查看） ===================== */
function openLightbox(src){
  const mask = document.createElement('div');
  mask.className='lightbox-mask';
  mask.innerHTML = `<button class="lightbox-close">×</button><img src="${src}">`;
  mask.onclick = ()=> mask.remove();
  document.body.appendChild(mask);
}
document.addEventListener('click', (e)=>{
  const img = e.target.closest('.entry-imgs img, .step-img, .img-thumb img');
  if(img && !e.target.closest('.rm')) openLightbox(img.src);
});

/* ===================== 工具函数 ===================== */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

loadState();
